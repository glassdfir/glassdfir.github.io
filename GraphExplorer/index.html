<body>
  <header>
    <h1>Graph Explorer</h1>
    <span class="note">Runs entirely in your browser. Your data never leaves this machine.</span>
  </header>

  <aside id="panel">
    <section>
      <h2>1. Load a CSV</h2>
      <input type="file" id="file" accept=".csv,text/csv" />

      <label>Source type <select id="srcType"></select></label>
      <label>Target type <select id="tgtType"></select></label>
      <button id="build" class="primary">Build graph</button>
    </section>

    <section>
      <h2>3. View</h2>
      <label>Layout
        <select id="layout">
          <option value="tree">Process Tree (hierarchy)</option>
          <option value="web">Relationship Web (force)</option>
        </select>
      </label>
      <label>Search <input id="search" placeholder="Highlight nodes…" /></label>
      <label>Label size <span id="fontSizeVal">10</span>px
        <input type="range" id="fontSize" min="6" max="28" value="10" />

          <option value="Helvetica, Arial, sans-serif">Helvetica / Arial</option>
          <option value="Georgia, 'Times New Roman', serif">Serif</option>
          <option value="Menlo, Consolas, 'Courier New', monospace">Monospace</option>
        </select>
      </label>
      <label>Edge labels
        <select id="edgeLabels">
          <option value="always">Always</option>
          <option value="hover">On hover / click</option>
          <option value="off">Off</option>
        </select>
      </label>
      <button id="fit">Fit to screen</button>
      <div id="legend"></div>
    </section>
  </aside>

  <main id="cy"></main>

  <aside id="inspector">
    <div class="inspector-head">
      <h2>Details</h2>
      <button id="inspectorClose" title="Hide panel" aria-label="Hide details panel">×</button>
    </div>
    <div id="inspectorBody"><p class="empty">Click a node or edge to see its details.</p></div>
  </aside>
