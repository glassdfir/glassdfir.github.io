# Tools listed on /tools/. Add a new entry here to add a tool to the page.
- name: Spoke
  url: /spoke/
  post: /blogsabout/spoke/
  tagline: See the relationships in your CSVs.
  description: >-
    Turn rows like who → did what → to what into an interactive graph.
    Load a CSV or Excel export, map the columns, then filter, follow process
    chains or insider risk webs, and export what you find.
  good_for: Process trees, insider risk, EDR exports, anything that's really a graph pretending to be a spreadsheet.

- name: Huddle
  url: /huddle/
  post: /blogsabout/building-dfir-playbooks-with-huddle/
  tagline: Build and run DFIR playbooks.
  description: >-
    Drag incident response plays into the lifecycle phases, connect them with
    decisions, and export a runbook or work it as a timestamped checklist.
    Includes templates and an AI-Assisted SOC play library.
  good_for: Writing playbooks before the incident and following them during it.

- name: Mill
  url: /mill/
  tagline: Merge your logs into one timeline.
  description: >-
    Drop in CSV, TSV or JSON exports from different tools and Mill finds
    the timestamps, merges everything in UTC, and charts it. Zoom into bursts,
    filter, tag the key events with ATT&CK-style phases, and export the story.
  good_for: Event logs, Sysmon, proxy, $MFT and EDR exports from the same incident, side by side.
  try: /mill/?sample=1

- name: Sieve
  url: /sieve/
  post: /blogsabout/shaping-messy-dfir-data-with-sieve/
  tagline: Shake raw exports into clean CSVs.
  description: >-
    Drop in CSV, TSV or JSON from EZTools, Hayabusa, Sysmon, Security-Datasets
    or a proxy, and Sieve maps the columns, normalizes time to UTC, removes
    duplicates (including the same process start logged by Sysmon and 4688),
    and pulls out IOCs. Send the result straight to Mill or Spoke.
  good_for: Getting messy evidence into shape before you build a timeline or a graph.
