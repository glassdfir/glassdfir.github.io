  <script>
/* Library panel, inspector and play editor. */
(function () {
  const H = window.H, U = H.U, S = H.S, el = U.el;
  const $ = (id) => document.getElementById(id);
  S.filter = { q: '', phases: new Set(), lib: 'all' };
  // Groups start collapsed; we remember which ones the user has opened.
  S.expanded = new Set(U.store.get('huddle.expanded', []));
  const isCollapsed = (id) => !S.expanded.has(id);
  const saveExpanded = () => U.store.set('huddle.expanded', [...S.expanded]);
  function toggleGroup(id) {
    S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id);
    saveExpanded();
    H.renderLibrary();
  }

  /* Steps can say who does them: "Agent: ..." or "Human: ..." */
  H.stepActor = function (step) {
    const m = String(step).match(/^\s*(agent|ai|bot|automation|human|analyst|person)\s*:\s*/i);
    if (!m) return { actor: null, text: step };
    const k = m[1].toLowerCase();
    return { actor: ['agent', 'ai', 'bot', 'automation'].includes(k) ? 'agent' : 'human', text: step.slice(m[0].length) };
  };
  H.stepEl = function (step) {
    const a = H.stepActor(step);
    return el('span.step-txt', a.actor ? el('span.actor.' + a.actor, a.actor === 'agent' ? 'Agent' : 'Human') : null, a.text);
  };
  H.stepSummary = function (steps) {
    if (!steps.length) return null;
    let ag = 0, hu = 0;
    steps.forEach((x) => { const a = H.stepActor(x).actor; if (a === 'agent') ag++; else if (a === 'human') hu++; });
    if (!ag && !hu) return el('span', steps.length + ' steps');
    return el('span', ag ? el('span.actor-n.agent', ag + ' agent') : null, ag && hu ? ' · ' : null, hu ? el('span.actor-n.human', hu + ' human') : null);
  };

  /* ---------------- Library ---------------- */
  function haystack(p) {
    return [p.id, p.title, p.summary, H.phase(p.phase).name, ...p.tags, ...p.tools, ...p.attack, ...p.roles, ...p.artifacts, ...p.steps].join(' \u0001 ').toLowerCase();
  }
  function tokens() { return S.filter.q.toLowerCase().split(/\s+/).filter(Boolean); }
  function highlight(text, toks) {
    let s = U.esc(text);
    if (!toks.length) return s;
    const re = new RegExp('(' + toks.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    return s.replace(re, '<mark>$1</mark>');
  }
  H.filteredPlays = function () {
    const toks = tokens();
    return [...S.plays.values()].filter((p) => {
      if (S.filter.lib !== 'all' && p._lib !== S.filter.lib) return false;
      if (S.filter.phases.size && !S.filter.phases.has(p.phase)) return false;
      if (!toks.length) return true;
      const h = haystack(p);
      return toks.every((t) => h.includes(t));
    }).sort((a, b) => H.phaseIndex(a.phase) - H.phaseIndex(b.phase) || a.id.localeCompare(b.id));
  };

  H.renderLibrary = function () {
    // phase chips
    const chips = $('phase-chips');
    chips.classList.toggle('filtering', S.filter.phases.size > 0);
    chips.replaceChildren(...S.phases.map((p) => el('button.chip' + (S.filter.phases.has(p.id) ? '.on' : ''), {
      title: 'Filter: ' + p.name,
      onclick: () => { S.filter.phases.has(p.id) ? S.filter.phases.delete(p.id) : S.filter.phases.add(p.id); H.renderLibrary(); },
    }, el('span.dot', { style: { background: p.color } }), p.short || p.name)));

    // library select
    const sel = $('lib-filter');
    const opts = [el('option', { value: 'all' }, 'All libraries (' + S.plays.size + ')')];
    S.libs.forEach((l) => {
      if (l.source === 'embedded' && !l.plays.length) return;
      if (l.source === 'custom' && !l.plays.length) return;
      opts.push(el('option', { value: l.key }, l.name + ' (' + l.plays.length + ')'));
    });
    sel.replaceChildren(...opts);
    if (![...sel.options].some((o) => o.value === S.filter.lib)) S.filter.lib = 'all';
    sel.value = S.filter.lib;

    // cards
    const toks = tokens();
    const list = H.filteredPlays();
    const used = new Set(S.pb.nodes.filter((n) => n.type === 'play').map((n) => n.playId));
    const active = S.sel && S.sel.type === 'play' ? S.sel.id : (S.sel && S.sel.type === 'node' && H.node(S.sel.id) ? H.node(S.sel.id).playId : null);
    $('lib-count').textContent = list.length === S.plays.size ? list.length + ' plays' : list.length + ' of ' + S.plays.size;
    const out = [];
    let lastPhase = null;
    const searching = toks.length > 0;
    const perPhase = {};
    list.forEach((p) => (perPhase[p.phase] = (perPhase[p.phase] || 0) + 1));
    const groups = Object.keys(perPhase);
    const allCollapsed = groups.length && groups.every(isCollapsed);
    const ca = $('btn-collapse-all');
    ca.textContent = allCollapsed ? 'Expand all' : 'Collapse all';
    ca.disabled = searching || !groups.length;
    ca.onclick = () => {
      groups.forEach((id) => (allCollapsed ? S.expanded.add(id) : S.expanded.delete(id)));
      saveExpanded();
      H.renderLibrary();
    };
    list.forEach((p) => {
      if (p.phase !== lastPhase) {
        lastPhase = p.phase;
        const ph = H.phase(p.phase);
        const closed = !searching && isCollapsed(ph.id);
        out.push(el('button.phase-group-h' + (closed ? '.closed' : ''), {
          type: 'button', 'data-phase': ph.id, 'aria-expanded': String(!closed),
          title: searching ? 'Groups stay open while searching' : (closed ? 'Expand ' : 'Collapse ') + ph.name,
          onclick: () => { if (!searching) toggleGroup(ph.id); },
        }, el('span.chev', '▾'), el('span.dot', { style: { background: ph.color } }), ph.name, el('span.gc', String(perPhase[ph.id]))));
      }
      if (!searching && isCollapsed(p.phase)) return;
      const lib = H.libOf(p._lib);
      out.push(el('div.card' + (active === p.id ? '.active' : ''), {
        draggable: 'true', 'data-play': p.id, style: { '--pc': H.phase(p.phase).color },
        ondragstart: (e) => {

        },
        onclick: (e) => { if (e.target.closest('.add')) return; S.sel = { type: 'play', id: p.id }; H.renderInspector(); H.renderLibrary(); },
      },
      el('div.t', { html: highlight(p.title, toks) }),
      el('div.s', { html: highlight(p.summary, toks) }),
      el('div.meta', el('span.id', { html: highlight(p.id, toks) }), p.time ? el('span', p.time) : null,
        p.attack.length ? el('span', p.attack.slice(0, 3).join(' ')) : null,
        lib && lib.source !== 'core' ? el('span', '· ' + lib.name) : null,
        used.has(p.id) ? el('span.used', '● in playbook') : null),
      el('button.add', { title: 'Add to playbook', 'aria-label': 'Add ' + p.title, onclick: () => H.addNode({ type: 'play', playId: p.id }) }, '+')));
    });
    if (!out.length) out.push(el('div.no-results', 'No plays match. ', el('button.btn.small', { onclick: () => H.openPlayEditor({ title: S.filter.q }) }, 'Create "' + (S.filter.q || 'new play') + '"')));
    $('play-list').replaceChildren(...out);
  };

  function initLibrary() {
    const search = $('search');
    search.addEventListener('input', U.debounce(() => { S.filter.q = search.value; H.renderLibrary(); }, 80));
    $('lib-filter').addEventListener('change', (e) => { S.filter.lib = e.target.value; H.renderLibrary(); });
    const pal = [['start', 'Trigger'], ['decision', 'Decision'], ['note', 'Note'], ['end', 'End']];
    $('palette').replaceChildren(...pal.map(([type, label]) => el('div.pal-item', {
      draggable: 'true', title: 'Drag onto the canvas, or click to add',
      ondragstart: (e) => { e.dataTransfer.setData('text/x-huddle', JSON.stringify({ type })); e.dataTransfer.effectAllowed = 'copy'; },
      onclick: () => H.addNode({ type }),
    }, label)));
    $('btn-new-play').onclick = () => H.openPlayEditor();
    $('btn-import-lib').onclick = () => H.pickFile();
    $('btn-url-lib').onclick = openUrlModal;

    // Drop library files onto the panel

    lib.addEventListener('dragover', (e) => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); lib.style.outline = '2px solid var(--accent)'; } });

  }

  function openUrlModal() {

  function phaseChip(id) {

  function listSection(title, items, ordered) {

  }
  function playBody(p, steps) {
    return [

      tagSection('Tools', p.tools),

  function bindEdit(input, apply) {
    let committed = false;

  H.focusInspector = () => { const i = insp().querySelector('input:not([disabled]), textarea:not([disabled])'); if (i) i.focus(); };

  H.renderInspector = function () {

  function playPreview(p) {

  /* ---------------- Play editor ---------------- */

      refs: el('textarea', { rows: 2, placeholder: 'One URL per line' }),
    };

    const csv = (s) => s.split(',').map((x) => x.trim()).filter(Boolean);
    U.modal({
      title: editing ? 'Edit play' : 'New play',
      wide: true,
      body: el('div', phaseList,

        el('div.row2', U.field('Roles', f.roles), U.field('ATT&CK techniques', f.attack)),
        el('div.row2', U.field('Tags', f.tags), U.field('References', f.refs)),

      buttons: [{ label: 'Cancel' }, {
        label: editing ? 'Save' : 'Create play', primary: true, onClick: () => {
          const title = f.title.value.trim();
          if (!title) { f.title.focus(); U.toast('A title is required', true); return false; }
          let id = f.id.value.trim();
          if (!id) {

          const play = H.normalizeLibrary({

              id, title, phase: f.phase.value, time: f.time.value, summary: f.summary.value, steps: U.lines(f.steps.value),
              tools: csv(f.tools.value), artifacts: csv(f.artifacts.value), roles: csv(f.roles.value), attack: csv(f.attack.value),
              tags: csv(f.tags.value), refs: U.lines(f.refs.value),

  <script>
/* Runbook ordering and exports (Markdown, print, Mermaid, CSV, JSON, SVG). */
(function () {
  const H = window.H, U = H.U, S = H.S, el = U.el;

  /* Order nodes by flow: topological over the graph with back edges removed,
   * ties broken by lane (phase) then vertical position. */
  H.orderNodes = function () {
    const nodes = S.pb.nodes;
    const pri = (n) => H.laneOf(n) * 1e6 + n.y;
    const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
    const outs = {}; nodes.forEach((n) => (outs[n.id] = []));
    S.pb.edges.forEach((e) => { if (byId[e.from] && byId[e.to]) outs[e.from].push(e.to); });
    const indegAll = {}; nodes.forEach((n) => (indegAll[n.id] = 0));
    S.pb.edges.forEach((e) => { if (byId[e.to] && byId[e.from]) indegAll[e.to]++; });
    const st = {}, dag = {}; nodes.forEach((n) => (dag[n.id] = []));
    const visit = (id) => {
      st[id] = 1;
      outs[id].slice().sort((a, b) => pri(byId[a]) - pri(byId[b])).forEach((t) => {
        if (st[t] === 1) return;
        dag[id].push(t); if (!st[t]) visit(t);
      });
      st[id] = 2;
    };
    const sorted = nodes.slice().sort((a, b) => (a.type === 'start' ? -1 : 0) - (b.type === 'start' ? -1 : 0) || (indegAll[a.id] ? 1 : 0) - (indegAll[b.id] ? 1 : 0) || pri(a) - pri(b));
    sorted.forEach((n) => { if (!st[n.id]) visit(n.id); });
    const indeg = {}; nodes.forEach((n) => (indeg[n.id] = 0));
    nodes.forEach((n) => dag[n.id].forEach((t) => indeg[t]++));
    const ready = nodes.filter((n) => !indeg[n.id]).map((n) => n.id);
    const order = [];
    while (ready.length) {
      ready.sort((a, b) => {
        const A = byId[a], B = byId[b];
        if (A.type === 'start' !== (B.type === 'start')) return A.type === 'start' ? -1 : 1;
        if (A.type === 'end' !== (B.type === 'end')) return A.type === 'end' ? 1 : -1;
        return pri(A) - pri(B);
      });
      const id = ready.shift(); order.push(byId[id]);
      dag[id].forEach((t) => { if (--indeg[t] === 0) ready.push(t); });
    }
    return order;
  };

  /* Structured runbook used by every export and by run mode. */
  H.runbook = function () {
    const order = H.orderNodes();
    let num = 0;
    const entries = order.map((n) => {
      const p = n.type === 'play' ? H.getPlay(n.playId) : null;
      const numbered = n.type === 'play' || n.type === 'decision';
      return {
        id: n.id, node: n, type: n.type, play: p, num: numbered ? ++num : null,
        lane: H.laneOf(n), phase: S.phases[H.laneOf(n)],
        title: H.nodeTitle(n), steps: H.nodeSteps(n),
        owner: n.owner || '', time: n.sla || (p && p.time) || '', notes: n.notes || '',
        next: [],
      };
    });
    const byId = Object.fromEntries(entries.map((e) => [e.id, e]));
    S.pb.edges.forEach((ed) => {
      const a = byId[ed.from], b = byId[ed.to];
      if (!a || !b) return;
      a.next.push({ label: ed.label || (ed.port === 'yes' ? 'Yes' : ed.port === 'no' ? 'No' : ''), port: ed.port || 'out', to: b });
    });
    entries.forEach((e) => e.next.sort((x, y) => (x.port === 'yes' ? -1 : 0) - (y.port === 'yes' ? -1 : 0) || (x.port === 'no' ? 1 : 0) - (y.port === 'no' ? 1 : 0)));
    return entries;
  };
  H.refName = (e) => (e.num ? e.num + '. ' + e.title : e.type === 'end' ? 'End: ' + e.title : e.title);

  /* ---------------- Markdown ---------------- */
  H.toMarkdown = function () {
    const pb = S.pb, rb = H.runbook();
    const L = [];
    L.push('# ' + (pb.name || 'Untitled playbook'), '');
    if (pb.description) L.push('> ' + pb.description.replace(/\n/g, '\n> '), '');
    const meta = [];
    if (pb.incident) meta.push('**Incident:** ' + pb.incident);
    meta.push('**Generated:** ' + U.fmtTs(U.nowIso()));
    meta.push('**Steps:** ' + rb.filter((e) => e.num).length);
    L.push(meta.join(' · '), '');
    rb.filter((e) => e.type === 'start').forEach((e) => L.push('**Trigger:** ' + e.title + (e.owner ? ' _(owner: ' + e.owner + ')_' : ''), ''));
    let lane = null;
    rb.forEach((e, i) => {
      if (e.type === 'start') return;
      if (e.lane !== lane && e.type !== 'end') { lane = e.lane; L.push('## ' + e.phase.name, ''); }
      if (e.type === 'note') { L.push('> **Note:** ' + e.title.replace(/\n/g, '\n> '), ''); return; }
      if (e.type === 'end') { L.push('**End:** ' + e.title, ''); return; }
      if (e.type === 'decision') {
        L.push('### ' + e.num + '. Decision: ' + e.title, '');
        if (e.owner) L.push('Decision maker: ' + e.owner, '');
        e.next.forEach((x) => L.push('- **' + (x.label || 'Then') + '** → ' + H.refName(x.to)));
        if (e.notes) L.push('', e.notes);
        L.push('');
        return;
      }
      const p = e.play;
      L.push('### ' + e.num + '. ' + e.title, '');
      const sub = ['`' + e.node.playId + '`'];
      if (e.owner) sub.push('Owner: ' + e.owner);
      if (e.time) sub.push('Target: ' + e.time);
      L.push(sub.join(' · '), '');
      if (p && p.summary) L.push(p.summary, '');
      e.steps.forEach((s) => L.push('- [ ] ' + s));
      if (e.steps.length) L.push('');
      if (p) {
        const extra = [];
        if (p.tools.length) extra.push('**Tools:** ' + p.tools.join(', '));
        if (p.artifacts.length) extra.push('**Artifacts:** ' + p.artifacts.join(', '));
        if (p.attack.length) extra.push('**ATT&CK:** ' + p.attack.map((t) => (U.attackUrl(t) ? '[' + t + '](' + U.attackUrl(t) + ')' : t)).join(', '));
        if (extra.length) L.push(extra.join('  \n'), '');
      }
      if (e.notes) L.push('**Notes:** ' + e.notes, '');
      const following = rb.slice(i + 1).find((x) => x.type !== 'note');
      const simple = e.next.length === 1 && !e.next[0].label && e.next[0].to === following;
      if (e.next.length && !simple) L.push('➜ **Next:** ' + e.next.map((x) => (x.label ? x.label + ': ' : '') + H.refName(x.to)).join('; '), '');
    });
    L.push('---', '_Built with Huddle._');
    return L.join('\n');
  };

  /* ---------------- Mermaid ---------------- */
  H.toMermaid = function () {
    const rb = H.runbook();
    const q = (s) => '"' + String(s).replace(/"/g, '#quot;').replace(/\n/g, '<br/>') + '"';
    const id = {}; rb.forEach((e, i) => (id[e.id] = 'N' + (i + 1)));
    const L = ['flowchart LR'];
    S.phases.forEach((ph, li) => {
      const inLane = rb.filter((e) => e.lane === li);
      if (!inLane.length) return;
      L.push('  subgraph L' + li + '[' + q(ph.name) + ']', '    direction TB');
      inLane.forEach((e) => {
        let shape;
        const label = e.type === 'play' ? e.num + '. ' + e.title + '<br/><small>' + e.node.playId + '</small>' : (e.num ? e.num + '. ' : '') + e.title;
        if (e.type === 'decision') shape = '{' + q(label) + '}';
        else if (e.type === 'start' || e.type === 'end') shape = '([' + q(label) + '])';
        else if (e.type === 'note') shape = '[/' + q(label) + '/]';
        else shape = '[' + q(label) + ']';
        L.push('    ' + id[e.id] + shape);
      });
      L.push('  end');
    });
    rb.forEach((e) => e.next.forEach((x) => L.push('  ' + id[e.id] + (x.label ? ' -->|' + q(x.label) + '| ' : ' --> ') + id[x.to.id])));
    S.phases.forEach((ph, li) => { if (rb.some((e) => e.lane === li)) L.push('  style L' + li + ' fill:none,stroke:' + ph.color + ',stroke-width:2px'); });
    rb.forEach((e) => { if (e.play) L.push('  style ' + id[e.id] + ' stroke:' + H.phase(e.play.phase).color + ',stroke-width:2px'); });
    return L.join('\n');
  };

  /* ---------------- CSV ---------------- */
  H.toCSV = function () {
    const rows = H.runbook().filter((e) => e.type !== 'note').map((e) => ({
      Step: e.num || '', Phase: e.phase.name, Type: e.type, 'Play ID': e.node.playId || '', Title: e.title,
      Owner: e.owner, 'Target time': e.time, Steps: e.steps.join(' | '),
      Tools: e.play ? e.play.tools.join(' | ') : '', 'ATT&CK': e.play ? e.play.attack.join(' | ') : '',
      Notes: e.notes, Next: e.next.map((x) => (x.label ? x.label + ': ' : '') + H.refName(x.to)).join(' | '),
    }));
    return U.toCSV(rows, ['Step', 'Phase', 'Type', 'Play ID', 'Title', 'Owner', 'Target time', 'Steps', 'Tools', 'ATT&CK', 'Notes', 'Next']);
  };

  /* ---------------- Print ---------------- */
  H.printRunbook = function () {
    const pb = S.pb, rb = H.runbook();
    const pv = document.getElementById('print-view');
    const out = [el('h1', pb.name || 'Untitled playbook'),
      el('div.pv-meta', [pb.incident ? 'Incident ' + pb.incident + ' · ' : '', 'Generated ' + U.fmtTs(U.nowIso()), ' · Responder: ________________'].join('')),
      pb.description ? el('p', pb.description) : null];
    rb.filter((e) => e.type === 'start').forEach((e) => out.push(el('p', el('b', 'Trigger: '), e.title)));
    let lane = null;
    rb.forEach((e) => {
      if (e.type === 'start') return;
      if (e.lane !== lane && e.type !== 'end') { lane = e.lane; out.push(el('h2', { style: { '--lc': e.phase.color } }, e.phase.name)); }
      if (e.type === 'note') { out.push(el('p', el('i', 'Note: ' + e.title))); return; }
      if (e.type === 'end') { out.push(el('p', el('b', 'End: '), e.title)); return; }
      const color = e.play ? H.phase(e.play.phase).color : '#999';
      out.push(el('div.pv-item', { style: { '--pc': color } },
        el('h3', e.num + '. ' + (e.type === 'decision' ? 'Decision: ' : '') + e.title),
        el('div.pv-sub', [e.node.playId, e.owner && 'Owner: ' + e.owner, e.time && 'Target: ' + e.time].filter(Boolean).join(' · ')),
        e.play && e.play.summary ? el('div', e.play.summary) : null,
        e.steps.length ? el('ul.check', e.steps.map((s) => el('li', s))) : null,
        e.type === 'decision' ? el('ul.check', e.next.map((x) => el('li', (x.label || 'Then') + ' → ' + H.refName(x.to)))) : null,
        e.notes ? el('div', el('b', 'Notes: '), e.notes) : null,
        el('div.pv-sub', 'Completed by ________  at ________ UTC')));
    });
    pv.replaceChildren(...out.filter(Boolean));
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(done, 500); }, 50);
  };

  /* ---------------- SVG ---------------- */
  H.toSVG = function () {
    const cs = getComputedStyle(document.documentElement);
    const v = (n) => cs.getPropertyValue(n).trim();
    const C = { bg: v('--bg'), panel: v('--panel'), line: v('--line-2'), text: v('--text'), muted: v('--muted'), edge: v('--edge') };
    let maxY = 400;
    const sizes = {};
    S.pb.nodes.forEach((n) => { const h = H.measure(n.id) || 90; sizes[n.id] = { w: H.nodeWidth(n), h }; maxY = Math.max(maxY, n.y + h + 60); });
    const W = S.phases.length * H.LANE_W;
    const esc = U.esc;
    const wrap = (text, max) => {
      const words = String(text).split(/\s+/); const lines = []; let cur = '';
      words.forEach((w) => { if ((cur + ' ' + w).trim().length > max) { if (cur) lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
      if (cur) lines.push(cur); return lines.slice(0, 4);
    };
    const parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + maxY + '" viewBox="0 0 ' + W + ' ' + maxY + '" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">',
      '<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + C.edge + '"/></marker></defs>',
      '<rect width="100%" height="100%" fill="' + C.bg + '"/>'];
    S.phases.forEach((p, i) => {
      parts.push('<rect x="' + i * H.LANE_W + '" y="0" width="' + H.LANE_W + '" height="' + maxY + '" fill="' + (i % 2 ? 'rgba(128,128,128,0.07)' : 'rgba(128,128,128,0.03)') + '" stroke="' + C.line + '" stroke-width="0.5"/>');
      parts.push('<rect x="' + i * H.LANE_W + '" y="42" width="' + H.LANE_W + '" height="2" fill="' + p.color + '"/>');
      parts.push('<text x="' + (i * H.LANE_W + 14) + '" y="27" font-size="12" font-weight="700" letter-spacing="1" fill="' + C.text + '">' + esc(p.name.toUpperCase()) + '</text>');
    });
    document.querySelectorAll('#edge-layer g[data-edge]').forEach((g) => {
      const path = g.querySelector('path.edge');
      parts.push('<path d="' + path.getAttribute('d') + '" fill="none" stroke="' + C.edge + '" stroke-width="1.8" marker-end="url(#a)"/>');
      const lbl = g.querySelector('.edge-label');
      if (lbl) {
        const r = lbl.querySelector('rect'), t = lbl.querySelector('text');
        parts.push('<g transform="' + lbl.getAttribute('transform') + '"><rect width="' + r.getAttribute('width') + '" height="20" rx="10" fill="' + C.panel + '" stroke="' + C.line + '"/><text x="' + t.getAttribute('x') + '" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="' + C.text + '">' + esc(t.textContent) + '</text></g>');
      }
    });
    S.pb.nodes.forEach((n) => {
      const { w, h } = sizes[n.id];
      const x = n.x, y = n.y;
      const title = H.nodeTitle(n);
      if (n.type === 'decision') {
        parts.push('<polygon points="' + [x + w / 2, y, x + w, y + h / 2, x + w / 2, y + h, x, y + h / 2].join(',') + '" fill="' + C.panel + '" stroke="' + C.line + '" stroke-width="2"/>');
        wrap(title, 20).forEach((ln, i, arr) => parts.push('<text x="' + (x + w / 2) + '" y="' + (y + h / 2 - (arr.length - 1) * 7 + i * 14 + 4) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + C.text + '">' + esc(ln) + '</text>'));
        return;
      }
      const p = n.type === 'play' ? H.getPlay(n.playId) : null;
      const color = p ? H.phase(p.phase).color : n.type === 'start' ? '#3ecf8e' : C.line;
      const rx = n.type === 'start' || n.type === 'end' ? h / 2 : 8;
      parts.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + rx + '" fill="' + C.panel + '" stroke="' + (n.type === 'play' ? C.line : color) + '" stroke-width="' + (n.type === 'play' ? 1 : 2) + '"/>');
      if (n.type === 'play') parts.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="2" fill="' + color + '"/>');
      let ty = y + 20;
      if (n.type === 'play') { parts.push('<text x="' + (x + 10) + '" y="' + ty + '" font-size="10" fill="' + C.muted + '" font-family="ui-monospace, monospace">' + esc(n.playId + (n.owner ? '  ·  ' + n.owner : '')) + '</text>'); ty += 17; }
      const center = n.type === 'start' || n.type === 'end';
      if (center) { parts.push('<text x="' + (x + w / 2) + '" y="' + (y + 18) + '" text-anchor="middle" font-size="9" letter-spacing="1" fill="' + C.muted + '">' + (n.type === 'start' ? 'TRIGGER' : 'END') + '</text>'); ty = y + 35; }
      wrap(title, n.type === 'note' ? 38 : 34).forEach((ln, i) => parts.push('<text x="' + (center ? x + w / 2 : x + 10) + '" y="' + (ty + i * 16) + '"' + (center ? ' text-anchor="middle"' : '') + ' font-size="13" font-weight="' + (n.type === 'note' ? 400 : 600) + '" fill="' + C.text + '">' + esc(ln) + '</text>'));
    });
    parts.push('</svg>');
    return parts.join('\n');
  };

  /* ---------------- Export dispatcher ---------------- */
  const fname = (ext) => U.slug(S.pb.name || 'playbook') + '.' + ext;
  function previewModal(title, text, ext, type, extra) {
    U.modal({
      title, wide: true,
      body: el('div', extra || null, el('pre', text)),
      buttons: [
        { label: 'Copy', onClick: async () => { U.toast((await U.copy(text)) ? 'Copied' : 'Copy failed', false); return false; } },
        { label: 'Download', primary: true, onClick: () => { U.download(fname(ext), text, type); return false; } },
      ],
    });
  }
  H.doExport = function (kind) {
    if (!S.pb.nodes.length && kind !== 'json') { U.toast('Add some plays first', true); return; }
    if (kind === 'md') previewModal('Markdown runbook', H.toMarkdown(), 'md', 'text/markdown');
    else if (kind === 'mermaid') previewModal('Mermaid diagram', H.toMermaid(), 'mmd', 'text/plain',
      el('p.muted', 'Paste into GitHub, GitLab, Obsidian or any Markdown that renders ', el('code', '```mermaid'), ' blocks.'));
    else if (kind === 'csv') { U.download(fname('csv'), H.toCSV(), 'text/csv'); U.toast('CSV downloaded'); }
    else if (kind === 'json') { U.download(fname('huddle.json'), JSON.stringify(H.serialize(), null, 2), 'application/json'); U.toast('Playbook JSON downloaded'); }
    else if (kind === 'svg') { U.download(fname('svg'), H.toSVG(), 'image/svg+xml'); U.toast('Diagram downloaded'); }
    else if (kind === 'print') H.printRunbook();
  };
})();

  <script>
/* Run mode: work a playbook as a timestamped checklist during an incident. */
(function () {
  const H = window.H, U = H.U, S = H.S, el = U.el;
  const $ = (id) => document.getElementById(id);
  const key = () => 'huddle.run.' + S.pb.id;
  let run = null;

  function load() {
    run = U.store.get(key(), null);
    if (!run || typeof run !== 'object') run = { started: null, incident: S.pb.incident || '', items: {}, log: [] };
    run.items = run.items || {}; run.log = run.log || [];
    return run;
  }
  function save() { U.store.set(key(), run); }
  function log(text) {
    if (!run.started) run.started = U.nowIso();
    run.log.push({ ts: U.nowIso(), text });
  }
  H.runItem = function (id) {
    if (!S.pb) return null;
    if (!run || run._pb !== S.pb.id) { load(); run._pb = S.pb.id; }
    return run.items[id] || null;
  };
  function item(id) { return (run.items[id] = run.items[id] || { steps: {} }); }

  /* Nodes cut off by decisions already taken. */
  function skippedSet(rb) {
    const chosen = {};
    rb.forEach((e) => { const it = run.items[e.id]; if (e.type === 'decision' && it && it.choice != null) chosen[e.id] = it.choice; });
    if (!Object.keys(chosen).length) return new Set();
    const incoming = {}; rb.forEach((e) => (incoming[e.id] = 0));
    rb.forEach((e) => e.next.forEach((x) => incoming[x.to.id]++));
    const seen = new Set();
    const stack = rb.filter((e) => !incoming[e.id]);
    while (stack.length) {
      const e = stack.pop();
      if (seen.has(e.id)) continue;
      seen.add(e.id);
      e.next.forEach((x, i) => { if (chosen[e.id] != null && chosen[e.id] !== i) return; stack.push(x.to); });
    }
    return new Set(rb.filter((e) => !seen.has(e.id)).map((e) => e.id));
  }

  function render() {
    const box = $('run');
    const rb = H.runbook();
    const skipped = skippedSet(rb);
    const work = rb.filter((e) => e.num && !skipped.has(e.id));
    const done = work.filter((e) => (run.items[e.id] || {}).done).length;
    const pct = work.length ? Math.round((done / work.length) * 100) : 0;

    const incident = el('input.input', { value: run.incident || '', placeholder: 'Incident ID', 'aria-label': 'Incident ID' });
    incident.addEventListener('input', () => { run.incident = incident.value; save(); });

    const head = el('div.run-head',
      el('h2', S.pb.name || 'Playbook'), incident,
      el('span.muted', run.started ? 'Started ' + U.fmtTs(run.started) : 'Not started'),
      el('div.progress', { title: done + ' of ' + work.length + ' steps complete' }, el('div', { style: { width: pct + '%' } })),
      el('b', done + '/' + work.length),
      el('button.btn', { onclick: exportLog, title: 'Download a timestamped incident log' }, 'Export log'),
      el('button.btn', { onclick: () => { if (confirm('Clear all progress for this playbook?')) { U.store.del(key()); load(); run._pb = S.pb.id; render(); H.renderCanvas(); } } }, 'Reset'),
      el('button.btn.primary', { onclick: H.closeRun }, 'Back to builder'));

    const body = [];
    let lane = null;
    rb.forEach((e) => {
      if (e.type === 'start') { body.push(el('div.run-item', { style: { '--pc': '#3ecf8e' } }, el('div.ri-top', el('span.ri-num', '▶'), el('div.ri-title', 'Trigger: ' + e.title)))); return; }
      if (e.lane !== lane && e.type !== 'end') { lane = e.lane; body.push(el('div.run-phase', { style: { '--lc': e.phase.color } }, e.phase.name)); }
      if (e.type === 'note') { body.push(el('div.run-item', { style: { '--pc': '#f2d15c' } }, el('div.muted', { style: { whiteSpace: 'pre-wrap' } }, 'Note: ' + e.title))); return; }
      if (e.type === 'end') { body.push(el('div.run-item', el('div.ri-top', el('span.ri-num', '■'), el('div.ri-title', 'End: ' + e.title)))); return; }
      body.push(renderItem(e, skipped.has(e.id)));
    });
    if (!rb.length) body.push(el('p.muted', 'This playbook is empty. Add plays in the builder first.'));

    const scroll = box.querySelector('.run-body');
    const top = scroll ? scroll.scrollTop : 0;
    box.replaceChildren(head, el('div.run-body', el('div.run-inner', body)));
    box.querySelector('.run-body').scrollTop = top;
  }

  function renderItem(e, skipped) {
    const it = run.items[e.id] || { steps: {} };
    const color = e.play ? H.phase(e.play.phase).color : 'var(--line-2)';
    const cls = 'div.run-item' + (it.done ? '.done' : '') + (skipped ? '.skipped' : '');
    const meta = [e.node.playId, e.owner && 'Owner: ' + e.owner, e.time && 'Target: ' + e.time, e.play && e.play.tools.length && 'Tools: ' + e.play.tools.join(', ')].filter(Boolean);
    const kids = [el('div.ri-top', el('span.ri-num', e.num + '.'),
      el('div', { style: { flex: 1 } }, el('div.ri-title', (e.type === 'decision' ? '◆ ' : '') + e.title), meta.length ? el('div.ri-meta', meta.map((m) => el('span', m))) : null),
      it.done ? el('span.ri-done-ts', '✓ ' + U.fmtTs(it.done)) : null)];
    if (e.play && e.play.summary) kids.push(el('div.muted', { style: { paddingLeft: '36px', marginTop: '4px' } }, e.play.summary));
    if (e.notes) kids.push(el('div', { style: { paddingLeft: '36px', marginTop: '4px', whiteSpace: 'pre-wrap' } }, el('b', 'Playbook note: '), e.notes));
    if (e.steps.length) {
      kids.push(el('ul.ri-steps', e.steps.map((s, i) => {
        const ts = it.steps && it.steps[i];
        const cb = el('input', { type: 'checkbox', checked: !!ts, disabled: skipped, 'aria-label': s });
        cb.addEventListener('change', () => {
          const x = item(e.id);
          if (cb.checked) { x.steps[i] = U.nowIso(); log(e.num + '. ' + e.title + ' — ' + s); } else delete x.steps[i];
          const all = e.steps.every((_, j) => x.steps[j]);
          if (all && !x.done) { x.done = U.nowIso(); log('Completed ' + e.num + '. ' + e.title); }
          if (!all && x.done) delete x.done;
          save(); render(); H.renderCanvas();
        });
        return el('li' + (ts ? '.checked' : ''), el('label', { style: { display: 'flex', gap: '8px', flex: 1, cursor: 'pointer' } }, cb, H.stepEl(s)), ts ? el('span.ts', U.fmtTs(ts)) : null);
      })));
    }
    const actions = [];
    if (e.type === 'decision') {
      e.next.forEach((x, i) => actions.push(el('button.btn' + (it.choice === i ? '.choice-on' : ''), {
        disabled: skipped,
        onclick: () => {
          const r = item(e.id);
          if (r.choice === i) { delete r.choice; delete r.done; } else { r.choice = i; r.done = U.nowIso(); log('Decision ' + e.num + '. ' + e.title + ' → ' + (x.label || 'Then')); }
          save(); render(); H.renderCanvas();
        },
      }, (x.label || 'Then') + ' → ' + H.refName(x.to))));
    } else {
      actions.push(el('button.btn' + (it.done ? '' : '.primary'), {
        disabled: skipped,
        onclick: () => {
          const r = item(e.id);
          if (r.done) delete r.done; else { r.done = U.nowIso(); log('Completed ' + e.num + '. ' + e.title); }
          save(); render(); H.renderCanvas();
        },
      }, it.done ? 'Reopen' : 'Mark complete'));
    }
    const note = el('textarea', { placeholder: 'Findings, evidence IDs, who did what…', rows: 1, disabled: skipped }); note.value = it.note || '';
    note.addEventListener('input', U.debounce(() => { item(e.id).note = note.value; save(); }, 250));
    actions.push(note);
    kids.push(el('div.ri-actions', actions));
    if (e.type !== 'decision' && e.next.length) kids.push(el('div.ri-next', 'Next → ' + e.next.map((x) => (x.label ? x.label + ': ' : '') + H.refName(x.to)).join(' · ')));
    if (skipped) kids.push(el('div.ri-next', 'Skipped by an earlier decision'));
    return el(cls, { style: { '--pc': color } }, kids);
  }

  function exportLog() {
    const rb = H.runbook();
    const skipped = skippedSet(rb);
    const L = ['# Incident log: ' + (run.incident || S.pb.incident || 'untitled'), '',
      '**Playbook:** ' + S.pb.name + '  ', '**Started:** ' + (run.started ? U.fmtTs(run.started) : 'n/a') + '  ', '**Exported:** ' + U.fmtTs(U.nowIso()), '', '## Steps', ''];
    rb.filter((e) => e.num).forEach((e) => {
      const it = run.items[e.id] || { steps: {} };
      const status = skipped.has(e.id) ? 'SKIPPED' : it.done ? 'DONE ' + U.fmtTs(it.done) : 'OPEN';
      L.push('### ' + e.num + '. ' + e.title + ' — ' + status);
      if (e.type === 'decision' && it.choice != null && e.next[it.choice]) L.push('Decision: **' + (e.next[it.choice].label || 'Then') + '**');
      e.steps.forEach((s, i) => L.push('- [' + (it.steps && it.steps[i] ? 'x' : ' ') + '] ' + s + (it.steps && it.steps[i] ? ' _(' + U.fmtTs(it.steps[i]) + ')_' : '')));
      if (it.note) L.push('', '> ' + it.note.replace(/\n/g, '\n> '));
      L.push('');
    });
    L.push('## Timeline', '', '| Time (UTC) | Event |', '|---|---|');
    run.log.forEach((x) => L.push('| ' + U.fmtTs(x.ts) + ' | ' + x.text.replace(/\|/g, '\\|') + ' |'));
    U.download(U.slug(run.incident || S.pb.name) + '-log.md', L.join('\n'), 'text/markdown');
  }

  H.openRun = function () {
    if (H.tabletopOpen && H.tabletopOpen()) H.closeTabletop();
    if (H.coverageOpen && H.coverageOpen()) H.closeCoverage();
    load(); run._pb = S.pb.id;
    if (!run.incident && S.pb.incident) run.incident = S.pb.incident;
    $('run').hidden = false; render();
    const url = new URL(location.href); url.searchParams.set('mode', 'run'); history.replaceState(null, '', url);
  };
  H.closeRun = function () {
    $('run').hidden = true;
    const url = new URL(location.href); url.searchParams.delete('mode'); history.replaceState(null, '', url);
    H.renderCanvas();
  };
})();

</script>

/* My playbooks: keep several playbooks in browser local storage. */
(function () {

  const $ = (id) => document.getElementById(id);
  const KEY = 'huddle.playbooks';

  const all = () => U.store.get(KEY, {}) || {};
  const write = (lib) => U.store.set(KEY, lib);
  H.isSaved = () => !!(S.pb && all()[S.pb.id]);

  function entryFor(data) {
    return { id: data.id, name: data.name || 'Untitled playbook', updated: U.nowIso(), nodes: data.nodes.length, data };
  }

  /** Save the current playbook into My playbooks (or update it if already there). */
  H.savePlaybook = function ({ quiet = false } = {}) {
    const lib = all();
    const data = H.serialize();
    lib[data.id] = entryFor(data);
    write(lib);
    updateStatus();
    if (!quiet) U.toast('Saved to My playbooks');

  const sync = U.debounce(() => {
    if (!S.pb || S.readOnly) return;

    const data = H.serialize();

    s.className = 'save-state' + (saved ? ' saved' : '');

        return el('div.pbl-row',
          el('div.pbl-main', nameText, nameInput,
            el('div.pbl-meta', e.nodes + ' nodes · updated ' + rel(e.updated) + (e.data.incident ? ' · ' + e.data.incident : ''))),

                const copy = U.clone(e.data); copy.id = U.uid('pb'); copy.name = e.name + ' (copy)'; copy.created = U.nowIso();

      const on = S.navZone === 'library' && same(it, S.libCursor);
      it.el.classList.toggle('nav-focus', on);
      if (on) cur = it;
    });
    if (cur) cur.el.scrollIntoView({ block: 'nearest' });
  }
  const baseRender = H.renderLibrary;
  H.renderLibrary = function () { baseRender(); paintLib(); };

  function setLib(it) {
    S.navZone = 'library';
    S.libCursor = { kind: it.kind, id: it.id };
    if (it.kind === 'play') { S.sel = { type: 'play', id: it.id }; H.renderInspector(); }
    H.renderLibrary();
  }
  function libMove(d) {
    const items = libItems();
    if (!items.length) return;
    let i = items.findIndex((it) => same(it, S.libCursor));
    if (i < 0 && S.sel && S.sel.type === 'play') i = items.findIndex((it) => it.kind === 'play' && it.id === S.sel.id);
    if (i < 0) i = d > 0 ? -1 : items.length;
    setLib(items[Math.max(0, Math.min(items.length - 1, i + d))]);
  }
  function libHoriz(d) {
    const cur = libItems().find((it) => same(it, S.libCursor));
    if (!cur) return libMove(1);
    if (cur.kind === 'phase') {
      const open = cur.el.getAttribute('aria-expanded') === 'true';
      if ((d > 0 && !open) || (d < 0 && open)) cur.el.click();   // expand / collapse
      else if (d > 0) libMove(1);                                 // step into an open group
      return;
    }
    if (d < 0) { const p = H.getPlay(cur.id); if (p) setLib({ kind: 'phase', id: p.phase }); }
    else focusCanvas();
  }
  function libActivate() {
    const cur = libItems().find((it) => same(it, S.libCursor));
    if (!cur) return libMove(1);
    if (cur.kind === 'phase') { cur.el.click(); return; }
    H.addNode({ type: 'play', playId: cur.id });
    S.navZone = 'library';
    H.renderLibrary();
    const p = H.getPlay(cur.id);
    U.toast('Added ' + (p ? p.title : cur.id));
  }
  function focusLibrary() {
    S.navZone = 'library';
    if (!S.libCursor || !libItems().some((it) => same(it, S.libCursor))) {
      const first = libItems()[0];
      S.libCursor = first ? { kind: first.kind, id: first.id } : null;
    }
    if (S.libCursor && S.libCursor.kind === 'play') S.sel = { type: 'play', id: S.libCursor.id };
    H.changed({ soft: true });
  }

  /* ---------------- Canvas ---------------- */
  const selNode = () => (S.sel && S.sel.type === 'node' ? H.node(S.sel.id) : null);
  function center(n) { return { x: n.x + H.nodeWidth(n) / 2, y: n.y + (H.measure(n.id) || 90) / 2 }; }
  function ensureVisible(n) {
    const r = $('canvas').getBoundingClientRect(), v = S.view, m = 40;
    const sx = n.x * v.k + v.x, sy = n.y * v.k + v.y;
    const ex = sx + H.nodeWidth(n) * v.k, ey = sy + (H.measure(n.id) || 90) * v.k;
    if (sx < m) v.x += m - sx; else if (ex > r.width - m) v.x -= ex - (r.width - m);
    if (sy < m) v.y += m - sy; else if (ey > r.height - m) v.y -= ey - (r.height - m);
    H.applyView();
  }
  function selectNode(n) {
    S.navZone = 'canvas';
    S.sel = { type: 'node', id: n.id };
    H.changed({ soft: true });
    ensureVisible(n);
  }
  function focusCanvas() {
    const nodes = S.pb.nodes;
    if (!nodes.length) { U.toast('The playbook is empty. Press Enter on a play to add it.'); return; }
    let n = selNode();
    if (!n && S.libCursor && S.libCursor.kind === 'play') n = nodes.find((x) => x.playId === S.libCursor.id);
    if (!n) n = nodes.find((x) => x.type === 'start') || nodes.slice().sort((a, b) => H.laneOf(a) - H.laneOf(b) || a.y - b.y)[0];
    selectNode(n);
  }
  function nearest(pred, c, wx, wy) {
    let best = null, bd = Infinity;
    S.pb.nodes.forEach((n) => {
      if (!pred(n)) return;
      const p = center(n), d = Math.abs(p.x - c.x) * wx + Math.abs(p.y - c.y) * wy;
      if (d < bd) { bd = d; best = n; }
    });
    return best;
  }
  /* Right/Left follow the flow (Yes branch first); Up/Down move within a lane. */
  function canvasMove(dir) {
    const cur = selNode();
    if (!cur) return focusCanvas();
    const c = center(cur), lane = H.laneOf(cur);
    let target = null;
    if (dir === 'right' || dir === 'left') {
      const linked = S.pb.edges
        .filter((e) => (dir === 'right' ? e.from === cur.id : e.to === cur.id))
        .map((e) => ({ n: H.node(dir === 'right' ? e.to : e.from), port: e.port }))
        .filter((x) => x.n)
        .sort((a, b) => (b.port === 'yes') - (a.port === 'yes') || Math.abs(center(a.n).y - c.y) - Math.abs(center(b.n).y - c.y));
      target = linked.length ? linked[0].n : nearest((n) => (dir === 'right' ? H.laneOf(n) > lane : H.laneOf(n) < lane), c, 1, 1);
    } else {
      const down = dir === 'down';
      const inLane = S.pb.nodes.filter((n) => n !== cur && H.laneOf(n) === lane && (down ? n.y > cur.y : n.y < cur.y))
        .sort((a, b) => (down ? a.y - b.y : b.y - a.y));
      target = inLane[0] || nearest((n) => n !== cur && (down ? center(n).y > c.y : center(n).y < c.y), c, 1, 2);
    }
    if (target) selectNode(target);
  }

  /* ---------------- Actions ---------------- */
  function act(a) {
    if (a === 'library') return focusLibrary();
    if (a === 'canvas') return focusCanvas();
    if (S.navZone === 'canvas') {
      if (a === 'enter') { H.focusInspector(); return; }
      return canvasMove(a);
    }
    if (a === 'up') return libMove(-1);
    if (a === 'down') return libMove(1);
    if (a === 'left') return libHoriz(-1);
    if (a === 'right') return libHoriz(1);
    if (a === 'enter') return libActivate();
  }

  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'enter', '[': 'library', ']': 'canvas' };
  function onKey(e) {
    const t = e.target;
    if (t && t.id === 'search' && e.key === 'ArrowDown') {
      e.preventDefault(); t.blur(); S.libCursor = null; S.navZone = 'library'; libMove(1); return;
    }
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    if (t && t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
    if (H.overlayOpen() || document.querySelector('.modal-back')) return;
    const a = KEYS[e.key];
    if (!a) return;
    if (a === 'enter' && t && t.closest && t.closest('button, a')) return; // let focused buttons work normally
    e.preventDefault();
    act(a);
  }

  H.initNav = function () {
    document.addEventListener('keydown', onKey);
    $('library').addEventListener('pointerdown', (e) => {
      S.navZone = 'library';
      const card = e.target.closest('.card'), hd = e.target.closest('.phase-group-h');
      if (card) S.libCursor = { kind: 'play', id: card.dataset.play };
      else if (hd) S.libCursor = { kind: 'phase', id: hd.dataset.phase };
    }, true);
    $('canvas').addEventListener('pointerdown', () => { S.navZone = 'canvas'; }, true);
  };
})();

</script>
  <script>
/* Boot, toolbar, menus, keyboard shortcuts, URL handling. */
(function () {
  const H = window.H, U = H.U, S = H.S, el = U.el;
  const $ = (id) => document.getElementById(id);

  H.changed = function (opts) {
    opts = opts || {};
    H.renderCanvas();
    if (opts.library !== false) H.renderLibrary();
    if (opts.inspector !== false) H.renderInspector();
    const nameEl = $('pb-name');
    if (document.activeElement !== nameEl) nameEl.value = S.pb.name || '';
    document.title = (S.pb.name ? S.pb.name + ' · ' : '') + 'Huddle';
    $('btn-undo').disabled = !S.past.length;
    $('btn-redo').disabled = !S.future.length;
    H.save(); H.syncUrl();
  };

  H.overlayOpen = () => !$('run').hidden || !$('tabletop').hidden || !$('coverage').hidden;
  H.replacePlaybook = function (pb) {
    if (S.pb && S.pb.nodes.length) H.commit();
    S.pb = pb; S.sel = null;
    H.changed();
    requestAnimationFrame(() => {
      H.layout(S.pb, true); H.changed(); H.fitView();
    });
  };

  H.allTemplates = function () {
    const out = [];
    S.libs.forEach((l) => (l.templates || []).forEach((t) => out.push(Object.assign({ _lib: l.name }, t))));
    return out;
  };
  function startTemplate(t) {
    try { H.replacePlaybook(H.templateToPlaybook(t)); U.toast('Loaded template: ' + t.name); } catch (e) { U.toast('Template failed: ' + e.message, true); }
  }

  /* ---------------- Files ---------------- */
  H.pickFile = () => $('file-input').click();
  H.importFile = async function (file) {
    try {
      const text = await file.text();
      const t = text.trim();
      if (t.startsWith('{')) {
        const obj = JSON.parse(t);
        if (Array.isArray(obj.nodes)) {
          const prev = S.pb && S.pb.nodes.length ? JSON.stringify(S.pb) : null;
          H.loadPlaybook(obj);
          if (prev) S.past.push(prev);
          H.changed(); requestAnimationFrame(H.fitView);
          U.toast('Opened playbook: ' + (obj.name || file.name));
          return;
        }
      }
      const name = file.name.replace(/\.(json|csv)$/i, '');
      const lib = H.parseLibraryText(text, name);
      H.addFileLib(name, lib);
      S.filter.lib = 'file:' + name;
      H.changed();
      U.toast('Imported ' + lib.plays.length + ' plays from ' + file.name);
    } catch (e) {
      U.toast('Could not import ' + file.name + ': ' + e.message, true);
    }
  };

  /* ---------------- Menus ---------------- */
  function buildNewMenu() {
    const list = $('menu-new');
    const items = [el('button', { onclick: () => H.replacePlaybook(H.newPlaybook()) }, 'Blank playbook', el('span.desc', 'Start from an empty canvas'))];
    let lib = null;
    H.allTemplates().forEach((t) => {
      if (t._lib !== lib) { lib = t._lib; items.push(el('div.menu-label', lib === 'Huddle Core' ? 'Templates' : lib)); }
      items.push(el('button', { onclick: () => startTemplate(t) }, t.name, el('span.desc', t.description || t._lib)));
    });
    list.replaceChildren(...items);
    const core = H.allTemplates().filter((t) => t._lib === 'Huddle Core');
    $('empty-templates').replaceChildren(...core.map((t) => el('button.btn', { onclick: () => startTemplate(t), title: t.description }, t.name)),
      el('span.muted', { style: { flexBasis: '100%', fontSize: '12px' } }, 'More templates for cloud, insider risk, OT and AI-assisted SOC are under New ▾.'));
  }
  H.buildNewMenu = buildNewMenu;

  H.bindMenus = function (root) {
    root.querySelectorAll('.menu > .btn').forEach((b) => {
      b.setAttribute('aria-haspopup', 'true'); b.setAttribute('aria-expanded', 'false');
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const m = b.parentElement, open = m.classList.contains('open');
        document.querySelectorAll('.menu.open').forEach((x) => { x.classList.remove('open'); x.querySelector('.btn').setAttribute('aria-expanded', 'false'); });
        if (!open) {
          if (m.dataset.menu === 'new') buildNewMenu();
          m.classList.add('open'); b.setAttribute('aria-expanded', 'true');
          const first = m.querySelector('.menu-list button'); if (first && e.detail === 0) first.focus();
        }
      });
    });
  };
  function initMenus() {
    H.bindMenus(document.getElementById('topbar'));
    // Arrow keys and Escape inside open menus
    document.addEventListener('keydown', (e) => {
      const m = document.querySelector('.menu.open'); if (!m) return;
      const items = [...m.querySelectorAll('.menu-list button')];
      const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); const n = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]; if (n) n.focus(); }
      else if (e.key === 'Escape') { e.stopPropagation(); m.classList.remove('open'); const b = m.querySelector('.btn'); b.setAttribute('aria-expanded', 'false'); b.focus(); }
    }, true);
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-list') || e.target.closest('button')) document.querySelectorAll('.menu.open').forEach((x) => { x.classList.remove('open'); const b = x.querySelector('.btn'); if (b) b.setAttribute('aria-expanded', 'false'); });
    });
    document.querySelectorAll('[data-export]').forEach((b) => b.addEventListener('click', () => H.doExport(b.dataset.export)));

    $('btn-open').onclick = H.pickFile;
    $('file-input').addEventListener('change', (e) => { [...e.target.files].forEach((f) => H.importFile(f)); e.target.value = ''; });
    $('btn-share').onclick = async () => {
      const url = await H.shareUrl();
      const ok = await U.copy(url);
      const kb = (url.length / 1024).toFixed(1);
      if (!ok) { U.modal({ title: 'Share link', body: el('pre', url) }); return; }
      U.toast(url.length > 8000 ? 'Link copied (' + kb + ' KB). Long links can break in some chat tools; Export JSON and use ?pb=<url> instead.' : 'Share link copied (' + kb + ' KB)', url.length > 8000);
    };
    $('btn-undo').onclick = H.undo;
    $('btn-redo').onclick = H.redo;
    $('btn-layout').onclick = () => { H.commit(); H.layout(); H.changed(); H.fitView(); };
    $('btn-run').onclick = H.openRun;
    $('btn-tabletop').onclick = () => H.openTabletop();
    $('btn-coverage').onclick = () => H.openCoverage();
    $('btn-theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
    $('btn-help').onclick = showHelp;

    const name = $('pb-name');
    let committed = false;
    name.addEventListener('focus', () => (committed = false));
    name.addEventListener('input', () => { if (!committed) { H.commit(); committed = true; } S.pb.name = name.value; H.changed({ library: false }); });
    name.addEventListener('keydown', (e) => { if (e.key === 'Enter') name.blur(); });
  }

  function setTheme(t, persist) {
    document.documentElement.dataset.theme = t;
    if (persist) U.store.set('huddle.theme', t);
  }

  /* ---------------- Keyboard ---------------- */
  function initKeys() {
    document.addEventListener('keydown', (e) => {
      const typing = e.target.closest('input, textarea, select, [contenteditable]');
      if (H.tabletopKey && H.tabletopKey(e)) return;
      const runOpen = H.overlayOpen();
      const mod = e.ctrlKey || e.metaKey;
      if (e.key === 'Escape') {
        if (document.querySelector('.modal-back')) return;
        if (!$('run').hidden) { H.closeRun(); return; }
        if (H.tabletopOpen()) { if (!typing) H.closeTabletop(); else e.target.blur(); return; }
        if (H.coverageOpen()) { H.closeCoverage(); return; }
        if (typing) { e.target.blur(); return; }
        if (S.sel) { S.sel = null; H.changed({ library: true }); }
        return;
      }
      if (typing || runOpen || document.querySelector('.modal-back')) return;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? H.redo() : H.undo(); }
      else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); H.redo(); }
      else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); H.duplicateSelection(); }
      else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); H.savePlaybook(); }
      else if (e.key === 'Delete' || e.key === 'Backspace') { if (S.sel) { e.preventDefault(); H.deleteSelection(); } }
      else if (e.key === '/') { e.preventDefault(); $('search').focus(); $('search').select(); }
      else if (!mod && e.key.toLowerCase() === 'f') H.fitView();
      else if (!mod && (e.key === '+' || e.key === '=')) H.zoomAt(1.2);
      else if (!mod && e.key === '-') H.zoomAt(1 / 1.2);
    });
  }

  /* ---------------- Help ---------------- */
  function showHelp() {
    const row = (a, b) => el('tr', el('td', el('code', a)), el('td', b));
    U.modal({
      title: 'Huddle help', wide: true,
      body: el('div',
        el('p', 'Huddle builds incident response playbooks from a library of DFIR plays arranged across the incident lifecycle. Everything runs in your browser; nothing is uploaded.'),
        el('h4', 'URL options'),
        el('p.muted', 'Like CyberChef, the full playbook lives in the address bar after ', el('code', '#pb='), ', so any link reproduces it exactly. Query options extend or configure the app:'),
        el('table', el('tr', el('th', 'Parameter'), el('th', 'What it does')),
          row('?lib=<url>', 'Load an extra play library (JSON or CSV). Repeat to load several. The host must allow CORS.'),
          row('?pb=<url>', 'Load a playbook JSON from a URL, e.g. a file in your team\'s repo.'),
          row('?template=<id>', 'Start from a template: ' + H.allTemplates().map((t) => t.id).join(', ') + '.'),
          row('?q=<text>', 'Pre-fill the library search.'),
          row('?phase=<id,id>', 'Pre-filter the library by phase: ' + S.phases.map((p) => p.id).join(', ') + '.'),
          row('?mode=run', 'Open straight into run mode, for responders working the playbook.'),
          row('?mode=view', 'Read-only diagram (run mode still works).'),
          row('?mode=tabletop', 'Open the tabletop exercise view. Add &scenario=<id> to start a built-in scenario: ' + H.allScenarios().map((s) => s.id).join(', ') + '.'),
          row('?mode=coverage', 'Open the ATT&CK coverage view.'),
          row('?theme=light|dark', 'Force a theme.'),
          row('#pb=<data>', 'The compressed playbook itself (written automatically).')),
        el('h4', 'Library format'),
        el('p.muted', 'A library is JSON with a ', el('code', 'plays'), ' array, or a CSV with one play per row. Custom phases add new lanes. Libraries can also ship ', el('code', 'templates'), '.'),
        el('pre', JSON.stringify({
          name: 'Acme IR plays', version: '1.0.0',
          phases: [{ id: 'notify', name: 'Notification', color: '#e86fb0' }],
          plays: [{ id: 'ACME-001', title: 'Page the on-call IR lead', phase: 'Identification', summary: 'Use PagerDuty service IR-Primary.', steps: ['Trigger the IR-Primary service', 'Confirm acknowledgement within 15m'], tools: ['PagerDuty'], tags: ['comms'], attack: [], time: '15m', refs: ['https://wiki.acme.example/ir'] }],
        }, null, 2)),
        el('p.muted', 'CSV columns: ', el('code', 'id, title, phase, summary, steps, tools, artifacts, roles, tags, attack, time, refs'), '. Separate list items with ', el('code', '|'), '. Only ', el('code', 'title'), ' is required; ', el('code', 'phase'), ' accepts names like "Containment" or "Detection & Analysis".'),
        el('h4', 'Shortcuts'),
        el('table',
          row('/', 'Search plays'), row('Delete', 'Delete selection'), row('Ctrl+Z / Ctrl+Shift+Z', 'Undo / redo'),
          row('Ctrl+D', 'Duplicate node'), row('Ctrl+S', 'Save to My playbooks'), row('F', 'Fit diagram'),
          row('Scroll / Ctrl+scroll', 'Pan / zoom'), row('Alt while dragging', 'Free placement (no lane snap)'), row('Esc', 'Deselect / close')),
        el('h4', 'Arrow-key navigation'),
        el('table',
          row('↑ / ↓', 'Library: move through plays and phase groups. Canvas: move up or down within a lane'),
          row('← / →', 'Library: collapse / expand a group (→ on a play jumps to the canvas). Canvas: follow the flow back / forward'),
          row('Enter', 'Library: add the play to the playbook, or open/close a group. Canvas: edit the selected node'),
          row('[ / ]', 'Switch to the library / the canvas'),
          row('↓ in search', 'Jump from the search box into the results'))),
      buttons: [{ label: 'Close', primary: true }],
    });
  }

  /* Overlays sit below the top bar, which wraps onto two rows on narrow screens. */
  function trackTopbar() {
    const set = () => document.documentElement.style.setProperty('--top-h', $('topbar').offsetHeight + 'px');
    set();
    if (window.ResizeObserver) new ResizeObserver(set).observe($('topbar')); else addEventListener('resize', set);
  }

  /* ---------------- Boot ---------------- */
  async function boot() {
    trackTopbar();
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme') || U.store.get('huddle.theme', null) || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme(theme === 'light' ? 'light' : 'dark');

    H.initLibraries();
    H.initCanvas();
    H.initPanels();
    initMenus();
    initKeys();
    H.initPlaybooks();
    H.initNav();
    S.pb = H.newPlaybook();

    const abs = (u) => { try { return new URL(u, location.href).href; } catch (e) { return u; } };
    const libUrls = [...new Set([...params.getAll('lib'), ...H.storedUrlLibs()].filter(Boolean).map(abs))];
    await Promise.all(libUrls.map((u) => H.loadLibUrl(u, { quiet: true })));
    if (libUrls.length) U.toast('Loaded ' + libUrls.length + ' extra librar' + (libUrls.length === 1 ? 'y' : 'ies'));

    let fromTemplate = false;
    const hash = new URLSearchParams(location.hash.slice(1));
    try {
      if (hash.get('pb')) H.loadPlaybook(await U.decodeState(hash.get('pb')));
      else if (params.get('pb')) {
        const res = await fetch(params.get('pb'));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        H.loadPlaybook(await res.json());
      } else if (params.get('template')) {
        const t = H.allTemplates().find((x) => x.id === params.get('template'));
        if (!t) throw new Error('Unknown template ' + params.get('template'));
        S.pb = H.templateToPlaybook(t); fromTemplate = true;
      } else if (H.storedPlaybook()) H.loadPlaybook(H.storedPlaybook());
    } catch (e) {
      U.toast('Could not load playbook: ' + e.message, true);
      const stored = H.storedPlaybook();
      if (stored) { try { H.loadPlaybook(stored); } catch (e2) { /* keep blank */ } }
    }

    if (params.get('q')) { S.filter.q = params.get('q'); $('search').value = S.filter.q; }
    if (params.get('phase')) params.get('phase').split(',').forEach((p) => S.filter.phases.add(H.resolvePhase(p)));
    if (params.get('mode') === 'view') { S.readOnly = true; document.body.classList.add('read-only'); }

    buildNewMenu();
    H.changed();
    requestAnimationFrame(() => {
      if (fromTemplate) { H.layout(S.pb, true); H.changed(); }
      if (S.pb.nodes.length) H.fitView();
      if (params.get('mode') === 'run') H.openRun();
      if (params.get('mode') === 'tabletop') H.openTabletop(params.get('scenario'));
      if (params.get('mode') === 'coverage') H.openCoverage();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
