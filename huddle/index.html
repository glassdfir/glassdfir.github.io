<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huddle · DFIR Playbook Builder</title>
  <meta name="description" content="Build incident response playbooks by dragging DFIR plays into a lifecycle diagram.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a24'/%3E%3Ccircle cx='9' cy='11' r='3' fill='%234c8dff'/%3E%3Ccircle cx='23' cy='11' r='3' fill='%23ef5b5b'/%3E%3Ccircle cx='16' cy='22' r='3' fill='%233ecf8e'/%3E%3Cpath d='M9 11 L16 22 L23 11' stroke='%23e6ebf2' stroke-width='1.6' fill='none' stroke-dasharray='2 2'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #0e131b;
  --panel: #141a24;
  --panel-2: #1a2230;
  --raise: #212b3b;
  --line: #2a3546;
  --line-2: #364357;
  --text: #e6ebf2;
  --muted: #8b97a8;
  --accent: #4c8dff;
  --accent-ink: #ffffff;
  --danger: #ef5b5b;
  --ok: #3ecf8e;
  --lane-a: rgba(255, 255, 255, 0.018);
  --lane-b: rgba(255, 255, 255, 0.035);
  --edge: #6b7a90;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 8px;
}
:root[data-theme="light"] {
  --bg: #eef1f5;
  --panel: #ffffff;
  --panel-2: #f6f8fb;
  --raise: #eef2f7;
  --line: #dbe1ea;
  --line-2: #c8d0dc;
  --text: #17202c;
  --muted: #5f6b7c;
  --accent: #2563eb;
  --lane-a: rgba(15, 30, 60, 0.02);
  --lane-b: rgba(15, 30, 60, 0.045);
  --edge: #8492a6;
  --shadow: 0 6px 24px rgba(20, 30, 50, 0.12);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.45 var(--sans);
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
[hidden] { display: none !important; }

/* ---------- Top bar ---------- */
#topbar {
  min-height: 48px; flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.02em; }
.logo {
  width: 22px; height: 22px; border-radius: 6px; position: relative;
  background:
    radial-gradient(circle at 28% 34%, #4c8dff 0 3px, transparent 3.5px),
    radial-gradient(circle at 72% 34%, #ef5b5b 0 3px, transparent 3.5px),
    radial-gradient(circle at 50% 72%, #3ecf8e 0 3px, transparent 3.5px),
    var(--raise);
}
.brand-name { font-size: 15px; }
.pb-name {
  flex: 1; min-width: 120px; max-width: 420px; background: transparent; border: 1px solid transparent;
  border-radius: 6px; padding: 5px 8px; font-weight: 600;
}
.pb-name:hover { border-color: var(--line); }
.pb-name:focus { outline: none; border-color: var(--accent); background: var(--panel-2); }
.actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

.btn {
  background: var(--raise); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; white-space: nowrap; line-height: 1.3;
}
.btn:hover { border-color: var(--line-2); background: var(--panel-2); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.icon { width: 30px; padding: 5px 0; text-align: center; }
.btn.small { padding: 3px 8px; font-size: 12px; }

.menu { position: relative; }
.menu-list {
  display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 50; min-width: 220px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 4px; max-height: calc(100vh - 70px); overflow-y: auto; max-width: min(360px, 92vw);
}
.menu.open .menu-list { display: block; }
.menu-list button {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 5px; cursor: pointer;
}
.menu-list button:hover { background: var(--raise); }
.menu-list .menu-label { padding: 6px 10px 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.menu-list .desc { display: block; font-size: 11px; color: var(--muted); }

/* ---------- Layout ---------- */
#layout { flex: 1; display: grid; grid-template-columns: 300px 1fr 330px; min-height: 0; }
aside { background: var(--panel); min-height: 0; }
#library { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#inspector { border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; }

/* ---------- Library ---------- */
.lib-head { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
#search, .field input, .field select, .field textarea, #lib-filter, .input {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
}
#search:focus, .field input:focus, .field textarea:focus, .field select:focus, .input:focus { outline: none; border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.chip.on { background: var(--raise); border-color: var(--line-2); }
.chips.filtering .chip:not(.on) { opacity: 0.5; }
.lib-row { display: flex; gap: 8px; align-items: center; }
.lib-row select { flex: 1; }
.lib-row .muted { font-size: 11px; white-space: nowrap; }
.palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pal-item {
  font-size: 11px; text-align: center; padding: 5px 2px; border: 1px dashed var(--line-2); border-radius: 6px;
  cursor: grab; user-select: none; background: var(--panel-2);
}
.pal-item:hover { border-style: solid; }

.play-list { flex: 1; overflow-y: auto; padding: 6px 10px 12px; }
.phase-group-h {
  position: sticky; top: -6px; z-index: 1; background: var(--panel); padding: 8px 0 4px; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); display: flex; align-items: center; gap: 6px;
}
.phase-group-h .dot { width: 8px; height: 8px; border-radius: 2px; }
button.phase-group-h { width: 100%; border: 0; font: inherit; font-size: 11px; cursor: pointer; text-align: left; border-radius: 4px; }
button.phase-group-h:hover { color: var(--text); }
button.phase-group-h:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.phase-group-h .chev { display: inline-block; width: 10px; transition: transform 0.15s; }
.phase-group-h.closed .chev { transform: rotate(-90deg); }
.phase-group-h .gc { margin-left: auto; font-family: var(--mono); letter-spacing: 0; background: var(--raise); border-radius: 999px; padding: 0 7px; }
.card {
  position: relative; border: 1px solid var(--line); border-left: 3px solid var(--pc, var(--line)); border-radius: 6px;
  padding: 7px 30px 7px 9px; margin: 5px 0; background: var(--panel-2); cursor: grab; user-select: none;
}
.card:hover { border-color: var(--line-2); border-left-color: var(--pc); }
.card.active { outline: 1px solid var(--accent); }
.card .t { font-weight: 600; font-size: 12.5px; }
.card .s { color: var(--muted); font-size: 11.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; gap: 6px; margin-top: 4px; font-size: 10.5px; color: var(--muted); flex-wrap: wrap; }
.card .id { font-family: var(--mono); }
.card .add {
  position: absolute; right: 5px; top: 6px; width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--raise); cursor: pointer; line-height: 18px; padding: 0;
}
.card .add:hover { border-color: var(--accent); color: var(--accent); }
.card .used { color: var(--ok); }
.lib-foot { padding: 8px 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
.lib-foot .btn { flex: 1; }
.no-results { color: var(--muted); padding: 20px 4px; text-align: center; }
mark { background: rgba(242, 169, 59, 0.35); color: inherit; border-radius: 2px; }

/* ---------- Canvas ---------- */
#canvas { position: relative; overflow: hidden; background: var(--bg); outline: none; cursor: default; }
#canvas.panning { cursor: grabbing; }
#canvas.drop-target { box-shadow: inset 0 0 0 2px var(--accent); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#lanes { position: absolute; left: 0; top: 0; }
.lane { position: absolute; top: 0; border-right: 1px solid var(--line); }
.lane:nth-child(odd) { background: var(--lane-a); }
.lane:nth-child(even) { background: var(--lane-b); }
.lane-h {
  position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 8px;
  padding: 0 14px; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  border-bottom: 2px solid var(--lc); color: var(--text);
}
.lane-h .n { font-family: var(--mono); color: var(--muted); font-weight: 500; }
.lane-h .cnt { margin-left: auto; font-weight: 500; color: var(--muted); letter-spacing: 0; text-transform: none; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.8; marker-end: url(#arrow); pointer-events: stroke; cursor: pointer; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edge.sel { stroke: var(--accent); stroke-width: 2.4; marker-end: url(#arrow-sel); }
.edge.temp { stroke: var(--accent); stroke-dasharray: 5 4; pointer-events: none; }
.arrow-head { fill: var(--edge); }
.arrow-head.sel { fill: var(--accent); }
.edge-label rect { fill: var(--panel); stroke: var(--line-2); }
.edge-label text { fill: var(--text); font-size: 11px; font-weight: 600; }
.edge-label { pointer-events: all; cursor: pointer; }
.edge.done { stroke: var(--ok); }

#nodes { position: absolute; left: 0; top: 0; }
.node {
  position: absolute; width: 250px; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); user-select: none; cursor: grab;
}
.node:hover { border-color: var(--muted); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow); }
.node.dragging { cursor: grabbing; opacity: 0.92; z-index: 5; }
.node.connect-target { border-color: var(--ok); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 45%, transparent); }
.node.play { border-top: 4px solid var(--pc); }
.node .nh { display: flex; align-items: center; gap: 6px; padding: 7px 10px 2px; font-size: 10.5px; color: var(--muted); }
.node .nh .id { font-family: var(--mono); }
.node .nh .owner { margin-left: auto; background: var(--raise); padding: 0 6px; border-radius: 4px; color: var(--text); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .nt { padding: 0 10px 8px; font-weight: 600; font-size: 13px; line-height: 1.3; }
.node .nf { display: flex; gap: 8px; padding: 0 10px 8px; font-size: 10.5px; color: var(--muted); }
.node .nf .warn { color: var(--danger); }
.node.missing { border-style: dashed; border-color: var(--danger); }
.node.out-of-lane .nh::after { content: "outside home phase"; color: var(--muted); font-style: italic; }

.node.start, .node.end {
  width: 200px; border-radius: 999px; text-align: center; padding: 10px 16px; font-weight: 600; background: var(--raise);
}
.node.start::before, .node.end::before {
  display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600;
}
.node.start::before { content: "Trigger"; }
.node.end::before { content: "End"; }
.node.start { border: 2px solid var(--ok); }
.node.end { border: 2px solid var(--muted); }

.node.decision { width: 210px; height: 120px; background: transparent; border: 0; box-shadow: none; }
.node.decision .diamond {
  position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  background: var(--line-2);
}
.node.decision .diamond::after {
  content: ""; position: absolute; inset: 2px; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); background: var(--panel);
}
.node.decision.sel .diamond { background: var(--accent); }
.node.decision .dl {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 0 44px; font-weight: 600; font-size: 12px; line-height: 1.25;
}
.node.decision .dl::before {
  content: "◆ Decision"; position: absolute; top: 24px; left: 0; right: 0; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.node.note {
  background: color-mix(in srgb, #f2d15c 18%, var(--panel)); border: 1px solid color-mix(in srgb, #f2d15c 45%, var(--line));
  padding: 8px 10px; font-size: 12px; white-space: pre-wrap;
}
.node.note::before { content: "Note"; display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 2px; }

.port {
  position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--muted);
  cursor: crosshair; z-index: 2;
}
.port:hover { border-color: var(--accent); background: var(--accent); }
.port.out { right: -8px; top: 50%; margin-top: -7px; }
.port.yes { right: -8px; top: 50%; margin-top: -7px; border-color: var(--ok); }
.port.no { bottom: -8px; left: 50%; margin-left: -7px; border-color: var(--danger); }
.port-lbl { position: absolute; font-size: 9.5px; font-weight: 700; pointer-events: none; }
.port-lbl.yes { right: 10px; top: calc(50% - 22px); color: var(--ok); }
.port-lbl.no { left: calc(50% + 10px); bottom: 2px; color: var(--danger); }
.node.end .port.out { display: none; }

.node .run-badge { position: absolute; top: -9px; right: -9px; width: 20px; height: 20px; border-radius: 50%; background: var(--ok); color: #06261a; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; }

.empty-state {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, 90%); text-align: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; box-shadow: var(--shadow);
}
.empty-state h2 { margin: 0 0 6px; font-size: 18px; }
.empty-state p { margin: 0 0 14px; color: var(--muted); }
.empty-templates { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

.zoom-ctl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; background: var(--panel); padding: 4px; border-radius: 8px; border: 1px solid var(--line); box-shadow: var(--shadow); }
#zoom-pct { min-width: 54px; }

/* ---------- Inspector ---------- */
.insp h3 { margin: 4px 0 4px; font-size: 16px; line-height: 1.3; }
.insp .kicker { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.insp .kicker .pchip { color: var(--text); }
.pchip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: var(--raise); font-size: 11px; }
.pchip .dot { width: 7px; height: 7px; border-radius: 50%; }
.insp .summary { color: var(--muted); margin: 6px 0 12px; }
.insp section { margin: 14px 0; }
.insp h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.insp ol, .insp ul { margin: 0; padding-left: 18px; }
.insp li { margin: 3px 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
a.tag { color: var(--accent); text-decoration: none; font-family: var(--mono); }
a.tag:hover { border-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; }
.field label { font-size: 11px; color: var(--muted); }
.field textarea { min-height: 70px; resize: vertical; }
.field .hint { font-size: 11px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.kbd { font-family: var(--mono); font-size: 11px; background: var(--raise); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 11px; color: var(--muted); }
.lib-item { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.lib-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phase-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raise); margin-top: 8px; }

/* ---------- Modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(5, 8, 14, 0.55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { width: min(640px, 100%); max-height: 90vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.modal.wide { width: min(900px, 100%); }
.modal-h { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font-size: 15px; flex: 1; }
.modal-b { padding: 14px 16px; overflow-y: auto; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.modal pre, .code {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 12px/1.45 var(--mono);
  white-space: pre-wrap; word-break: break-word; max-height: 50vh; overflow: auto; margin: 0;
}
.modal table { border-collapse: collapse; width: 100%; font-size: 12px; }
.modal td, .modal th { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
.modal th { color: var(--muted); font-weight: 600; }
.modal code { font-family: var(--mono); font-size: 12px; background: var(--raise); padding: 0 4px; border-radius: 3px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 600; transition: all 0.2s; z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); color: #fff; }

/* ---------- Run mode ---------- */
.run { position: fixed; inset: var(--top-h, 48px) 0 0 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.run-head { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.run-head h2 { margin: 0; font-size: 16px; }
.run-head .input { width: 200px; }
.progress { flex: 1; min-width: 160px; height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ok); transition: width 0.25s; }
.run-body { flex: 1; overflow-y: auto; padding: 18px; }
.run-inner { max-width: 860px; margin: 0 auto; }
.run-phase { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.run-phase::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--lc); }
.run-item { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--pc, var(--line-2)); border-radius: 8px; padding: 12px 14px; margin: 8px 0; }
.run-item.done { opacity: 0.66; }
.run-item.done .ri-title { text-decoration: line-through; text-decoration-color: var(--muted); }
.run-item.skipped { opacity: 0.4; }
.ri-top { display: flex; align-items: flex-start; gap: 10px; }
.ri-num { font-family: var(--mono); color: var(--muted); min-width: 26px; padding-top: 1px; }
.ri-title { font-weight: 600; font-size: 14px; flex: 1; }
.ri-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.ri-steps { list-style: none; padding: 0 0 0 36px; margin: 8px 0 0; }
.ri-steps li { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; }
.ri-steps input { margin-top: 3px; }
.ri-steps .ts { margin-left: auto; font-size: 10.5px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
.ri-steps li.checked span:first-of-type { color: var(--muted); }
.ri-actions { display: flex; gap: 6px; align-items: center; padding-left: 36px; margin-top: 8px; flex-wrap: wrap; }
.ri-actions textarea { flex: 1 1 100%; min-height: 34px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; resize: vertical; }
.ri-done-ts { font-size: 11px; color: var(--ok); font-family: var(--mono); }
.choice-on { outline: 2px solid var(--accent); }
.ri-next { font-size: 11px; color: var(--muted); padding-left: 36px; margin-top: 6px; }

/* ---------- Print ---------- */
.print-view { display: none; }
@media print {
  body.printing { display: block; overflow: visible; background: #fff; color: #111; }
  body.printing > *:not(#print-view) { display: none !important; }
  body.printing #print-view { display: block; font: 11pt/1.45 Georgia, "Times New Roman", serif; color: #111; }
  #print-view h1 { font: 700 20pt/1.2 var(--sans); margin: 0 0 4pt; }
  #print-view h2 { font: 700 13pt/1.2 var(--sans); margin: 18pt 0 6pt; padding-bottom: 3pt; border-bottom: 2pt solid var(--lc, #333); page-break-after: avoid; }
  #print-view .pv-meta { font: 9.5pt var(--sans); color: #555; margin-bottom: 10pt; }
  #print-view .pv-item { page-break-inside: avoid; margin: 0 0 10pt; padding: 6pt 0 6pt 10pt; border-left: 3pt solid var(--pc, #999); }
  #print-view .pv-item h3 { font: 700 11.5pt var(--sans); margin: 0 0 2pt; }
  #print-view .pv-item .pv-sub { font: 9pt var(--sans); color: #555; }
  #print-view ul.check { list-style: none; padding-left: 0; margin: 4pt 0; }
  #print-view ul.check li::before { content: "☐ "; }
  #print-view .pv-lines { border-bottom: 1px solid #bbb; height: 16pt; }
  @page { margin: 16mm; }
}

@media (max-width: 1100px) {
  #layout { grid-template-columns: 260px 1fr 280px; }
  .actions .sep { display: none; }
}
@media (max-width: 820px) {
  #layout { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
  #library { grid-row: 1; border-right: 0; border-bottom: 1px solid var(--line); }
  #inspector { display: none; }
  .brand-name { display: none; }
}

/* Read-only mode (?mode=view) */
.read-only .port, .read-only .lib-foot, .read-only .card .add, .read-only #btn-undo, .read-only #btn-redo, .read-only #btn-layout { display: none !important; }
.read-only .node { cursor: default; }

/* My playbooks */
.save-state { background: none; border: 0; color: var(--muted); font-size: 11.5px; cursor: pointer; padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
.save-state:hover { background: var(--raise); color: var(--text); }
.save-state.saved { color: var(--ok); }
.pbl-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; }
.pbl-list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pbl-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.pbl-row:last-child { border-bottom: 0; }
.pbl-row:hover { background: var(--panel-2); }
.pbl-main { flex: 1; min-width: 0; }
.pbl-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbl-cur { margin-left: 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--raise); padding: 1px 6px; border-radius: 999px; }
.pbl-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.pbl-actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 1100px) { .save-state { display: none; } }

/* Agent / Human step labels */
.actor { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 0 5px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; line-height: 16px; }
.actor.agent { background: color-mix(in srgb, #a879ff 22%, transparent); color: #b89bff; border: 1px solid color-mix(in srgb, #a879ff 45%, transparent); }
.actor.human { background: color-mix(in srgb, #3ecf8e 18%, transparent); color: #3ecf8e; border: 1px solid color-mix(in srgb, #3ecf8e 40%, transparent); }
:root[data-theme="light"] .actor.agent { color: #6d3fd6; }
:root[data-theme="light"] .actor.human { color: #13865a; }
.actor-n.agent { color: #b89bff; }
.actor-n.human { color: #3ecf8e; }
:root[data-theme="light"] .actor-n.agent { color: #6d3fd6; }
:root[data-theme="light"] .actor-n.human { color: #13865a; }

/* Arrow-key navigation cursor in the library */
.card.nav-focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.phase-group-h.nav-focus { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--text); }

/* ---------- Shared bits ---------- */
.grow { flex: 1; }
.tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.tag.warn { color: #f2a93b; border-color: color-mix(in srgb, #f2a93b 50%, transparent); }
.linklike { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.linklike:hover { text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg-b { background: var(--raise); border: 0; border-right: 1px solid var(--line); padding: 4px 10px; cursor: pointer; font-size: 12px; }
.seg-b:last-child { border-right: 0; }
.seg-b:hover { background: var(--panel-2); }
.seg-b.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg-b:focus-visible, .linklike:focus-visible, .cov-t:focus-visible, .tt-sc:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
:root { --st-covered: #3ecf8e; --st-partial: #f2a93b; --st-gap: #ef5b5b; --st-na: #8b97a8; }
.run select, .run textarea, .run input:not([type=checkbox]) {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
.run select:focus, .run textarea:focus, .run input:focus { outline: none; border-color: var(--accent); }

/* ---------- Tabletop ---------- */
.tt-head .tt-clock { font-family: var(--mono); font-size: 20px; font-weight: 700; min-width: 74px; }
.tt-setup { max-width: 980px; margin: 0 auto; }
.tt-setup h3 { margin: 6px 0 4px; font-size: 15px; }
.tt-setup section { margin-bottom: 22px; }
.tt-scenarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 10px; }
.tt-sc { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.tt-sc:hover { border-color: var(--line-2); }
.tt-sc.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tt-sc-h { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tt-sc-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.tt-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 1fr) minmax(340px, 1.35fr) minmax(260px, 1fr); }
.tt-col { overflow-y: auto; padding: 14px 16px 40px; border-right: 1px solid var(--line); }
.tt-col:last-child { border-right: 0; }
.tt-col h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.tt-obj { margin: 6px 0 10px; font-size: 12px; }
.tt-obj summary { cursor: pointer; color: var(--muted); }
.tt-obj ul { margin: 6px 0; padding-left: 18px; }
.tt-inject { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
.tt-inject.next { border-color: var(--line-2); }
.tt-inject.due { border-color: #f2a93b; box-shadow: 0 0 0 1px #f2a93b inset; }
.tt-inject.released { opacity: 0.72; }
.tt-inj-h { display: flex; gap: 8px; align-items: baseline; }
.tt-inj-h b { flex: 1; }
.tt-at { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 40px; }
.tt-inj-text { margin: 6px 0 4px; }
.tt-q { margin: 4px 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
.tt-inject .btn-row { margin-top: 8px; }
.tt-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.tt-legend i, .cov-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tt-legend i.covered, .tt-bar .covered { background: var(--st-covered); }
.tt-legend i.partial, .tt-bar .partial { background: var(--st-partial); }
.tt-legend i.gap, .tt-bar .gap { background: var(--st-gap); }
.tt-legend i.na, .tt-bar .na { background: var(--st-na); }
.tt-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raise); margin: 8px 0 4px; }
.tt-step { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 8px; padding: 9px 12px; margin: 7px 0; display: flex; flex-direction: column; gap: 7px; }
.tt-step-h { display: flex; gap: 8px; align-items: flex-start; }
.tt-step textarea { width: 100%; min-height: 32px; resize: vertical; }
.tt-step.covered { border-right: 3px solid var(--st-covered); }
.tt-step.partial { border-right: 3px solid var(--st-partial); }
.tt-step.gap { border-right: 3px solid var(--st-gap); }
.tt-step.na { opacity: 0.6; }
.tt-step .seg-b.on.covered { background: var(--st-covered); color: #06261a; }
.tt-step .seg-b.on.partial { background: var(--st-partial); color: #2a1a00; }
.tt-step .seg-b.on.gap { background: var(--st-gap); color: #fff; }
.tt-step .seg-b.on.na { background: var(--st-na); color: #0e131b; }
.tt-branch { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.tt-obs-form { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.tt-obs-form .row2 { gap: 6px; }
.tt-obs-form .btn { align-self: flex-start; }
.tt-o { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.tt-o-h { display: flex; gap: 8px; align-items: center; font-size: 11px; margin-bottom: 3px; }
.tt-o-h .muted { flex: 1; }
.btn.icon.small { width: 24px; padding: 1px 0; }
.pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 1px 6px; border-radius: 999px; background: var(--raise); }
.pill.strength { color: var(--st-covered); }
.pill.gap { color: var(--st-gap); }
.pill.action { color: var(--accent); }
.tt-present { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; padding: 24px 48px; overflow-y: auto; }
.tp-top { display: flex; gap: 12px; align-items: center; }
.tp-title { flex: 1; font-weight: 700; color: var(--muted); font-size: 16px; }
.tp-clock { font-family: var(--mono); font-size: 32px; font-weight: 700; }
.tp-main { max-width: 1000px; margin: 6vh auto 0; width: 100%; }
.tp-main h1 { font-size: clamp(28px, 4.5vw, 52px); line-height: 1.12; margin: 6px 0 18px; }
.tp-at { font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 700; }
.tp-text { font-size: clamp(18px, 2.2vw, 26px); line-height: 1.45; }
.tp-q { margin-top: 26px; padding: 16px 20px; border-left: 4px solid var(--accent); background: var(--panel); border-radius: 8px; }
.tp-q h4, .tp-earlier h4 { margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--muted); }
.tp-q ul { margin: 0; padding-left: 22px; font-size: clamp(16px, 1.8vw, 22px); }
.tp-q li { margin: 6px 0; }
.tp-earlier { max-width: 1000px; margin: 40px auto 0; width: 100%; color: var(--muted); }
.tp-earlier > div { margin: 6px 0; }
@media (max-width: 1100px) {
  .tt-grid { grid-template-columns: 1fr 1fr; }
  .tt-col:last-child { grid-column: 1 / -1; border-top: 1px solid var(--line); }
}
@media (max-width: 820px) {
  .tt-grid { display: block; overflow-y: auto; }
  .tt-col { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
  .tt-present { padding: 16px; }
}

/* ---------- ATT&CK coverage ---------- */
.cov-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 320px; }
.cov-main { overflow: auto; padding: 14px 16px 40px; }
.cov-detail { overflow-y: auto; padding: 14px 16px 40px; border-left: 1px solid var(--line); background: var(--panel); }
.cov-detail h3 { margin: 6px 0 4px; font-size: 16px; }
.cov-detail h4 { margin: 16px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.cov-detail .kicker { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
.cov-detail a { color: var(--accent); }
.cov-list { list-style: none; padding: 0; margin: 0; }
.cov-list li { padding: 4px 0; border-bottom: 1px solid var(--line); }
.cov-stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; margin-bottom: 12px; }
.cov-stats .stat { min-width: 130px; }
.cov-legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); margin-left: auto; }
.cov-legend i.pb { background: var(--ok); }
.cov-legend i.lib { background: transparent; border: 1.5px dashed var(--accent); }
.cov-legend i.none { background: var(--raise); border: 1px solid var(--line); }
.cov-matrix { display: flex; gap: 6px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
.cov-col { flex: 1 0 112px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cov-th { position: sticky; top: 0; background: var(--bg); padding: 4px 2px 6px; font-size: 11px; line-height: 1.25; border-bottom: 2px solid var(--line-2); display: flex; flex-direction: column; min-height: 46px; }
.cov-th span { color: var(--muted); font-family: var(--mono); }
.cov-t { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 4px 6px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; position: relative; font-size: 11px; line-height: 1.25; }
.cov-t .cov-id { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
.cov-t .cov-c { position: absolute; top: 3px; right: 5px; font-size: 9.5px; font-weight: 700; }
.cov-t.pb { background: color-mix(in srgb, var(--ok) 26%, var(--panel)); border-color: color-mix(in srgb, var(--ok) 60%, transparent); }
.cov-t.pb .cov-id { color: var(--text); }
.cov-t.lib { border: 1.5px dashed color-mix(in srgb, var(--accent) 70%, transparent); }
.cov-t.none { opacity: 0.55; }
.cov-t:hover { border-color: var(--line-2); opacity: 1; }
.cov-t.sel { outline: 2px solid var(--accent); outline-offset: 1px; opacity: 1; }
.cov-extra { margin-top: 18px; }
.cov-extra h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.cov-row { display: flex; flex-wrap: wrap; gap: 4px; }
.cov-row .cov-t { width: 150px; }
.cov-foot { margin-top: 20px; font-size: 11.5px; max-width: 820px; }
@media (max-width: 820px) {
  .cov-body { display: block; overflow-y: auto; }
  .cov-main { overflow: visible; }
  .cov-detail { border-left: 0; border-top: 1px solid var(--line); }
}

/* ---------- Responsive top bar and mobile inspector ---------- */
.sheet-close { display: none !important; }
@media (max-width: 1280px) {
  #topbar { flex-wrap: wrap; row-gap: 6px; padding-top: 6px; padding-bottom: 6px; }
  .actions { order: 3; flex: 1 1 100%; margin-left: 0; flex-wrap: wrap; row-gap: 6px; }
  .pb-name { max-width: none; }
}
@media (max-width: 820px) {
  .actions .btn { padding: 4px 8px; font-size: 12px; }
  .actions .btn.icon { width: 28px; }
  .tt-head, .run-head { padding: 8px 12px; gap: 8px; }
  .run-head h2 { flex: 1 1 100%; }
  .cov-stats .stat { min-width: 0; flex: 1 1 40%; }
  .cov-legend { margin-left: 0; }
  body.has-sel #inspector {
    display: block; position: fixed; left: 0; right: 0; bottom: 0; max-height: 55vh; z-index: 30;
    background: var(--panel); border-left: 0; border-top: 1px solid var(--line-2); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);
    border-radius: 12px 12px 0 0;
  }
  .sheet-close { display: inline-block !important; float: right; }
  .tt-scenarios { grid-template-columns: 1fr; }
  .row2 { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-name">Huddle</span></div>
    <input id="pb-name" class="pb-name" spellcheck="false" aria-label="Playbook name">
    <button id="save-state" class="save-state" type="button"></button>
    <nav class="actions">
      <button class="btn" id="btn-playbooks" title="Your saved playbooks">My playbooks</button>
      <div class="menu" data-menu="new">
        <button class="btn">New ▾</button>
        <div class="menu-list" id="menu-new"></div>
      </div>
      <button class="btn" id="btn-open" title="Open a playbook or library file">Open</button>
      <div class="menu" data-menu="export">
        <button class="btn">Export ▾</button>
        <div class="menu-list">
          <button data-export="md">Markdown runbook</button>
          <button data-export="print">Print / PDF runbook</button>
          <button data-export="mermaid">Mermaid diagram</button>
          <button data-export="csv">CSV task list</button>
          <button data-export="json">Playbook JSON</button>
          <button data-export="svg">Diagram (SVG)</button>
        </div>
      </div>
      <button class="btn" id="btn-share" title="Copy a link containing this whole playbook">Share link</button>
      <span class="sep"></span>
      <button class="btn icon" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button class="btn icon" id="btn-redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
      <button class="btn" id="btn-layout" title="Arrange nodes into lifecycle lanes">Tidy</button>
      <button class="btn" id="btn-coverage" title="See which MITRE ATT&amp;CK techniques this playbook covers">ATT&amp;CK</button>
      <button class="btn" id="btn-tabletop" title="Rehearse this playbook against a scenario">Tabletop</button>
      <button class="btn primary" id="btn-run" title="Work the playbook as a checklist">▶ Run</button>
      <span class="sep"></span>
      <button class="btn icon" id="btn-theme" title="Toggle theme" aria-label="Toggle light or dark theme">◐</button>
      <button class="btn icon" id="btn-help" title="Help and URL options" aria-label="Help">?</button>
    </nav>
  </header>

  <main id="layout">
    <aside id="library" aria-label="Play library">
      <div class="lib-head">
        <input id="search" type="search" aria-label="Search plays" placeholder="Search plays, tools, tags, T1003…  ( / )" autocomplete="off">
        <div id="phase-chips" class="chips"></div>
        <div class="lib-row">
          <select id="lib-filter" aria-label="Library"></select>
          <span id="lib-count" class="muted"></span>
          <button class="btn small" id="btn-collapse-all" type="button">Collapse all</button>
        </div>
        <div class="palette" id="palette"></div>
      </div>
      <div id="play-list" class="play-list"></div>
      <div class="lib-foot">
        <button class="btn small" id="btn-new-play">+ New play</button>
        <button class="btn small" id="btn-import-lib">Import</button>
        <button class="btn small" id="btn-url-lib">From URL</button>
      </div>
    </aside>

    <section id="canvas" tabindex="0" aria-label="Playbook diagram">
      <div id="world">
        <div id="lanes"></div>
        <svg id="edges" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" class="arrow-head"/>
            </marker>
            <marker id="arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" class="arrow-head sel"/>
            </marker>
          </defs>
          <g id="edge-layer"></g>
          <path id="temp-edge" class="edge temp" d=""/>
        </svg>
        <div id="nodes"></div>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        <h2>Start a playbook</h2>
        <p>Drag plays from the library into the lifecycle lanes, then connect them by dragging from a node's right-hand dot to another node.</p>
        <div id="empty-templates" class="empty-templates"></div>
      </div>
      <div class="zoom-ctl">
        <button class="btn icon" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button class="btn" id="zoom-pct" title="Reset zoom">100%</button>
        <button class="btn icon" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="btn" id="zoom-fit" title="Fit to screen (F)">Fit</button>
      </div>
    </section>

    <aside id="inspector" aria-label="Details"></aside>
  </main>

  <div id="run" class="run" hidden></div>
  <div id="tabletop" class="run tt" hidden></div>
  <div id="coverage" class="run cov" hidden></div>
  <div id="print-view" class="print-view"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".json,.csv,application/json,text/csv" hidden>

  <script>
/* Huddle core play library.
 * The same shape is used by external libraries loaded with ?lib=<url>.
 * See README.md for the library schema. */
(function () {
  const H = (window.H = window.H || {});

  H.DEFAULT_PHASES = [
    { id: 'prep', name: 'Preparation', short: 'PREP', color: '#4c8dff' },
    { id: 'ident', name: 'Identification', short: 'IDENT', color: '#f2a93b' },
    { id: 'contain', name: 'Containment', short: 'CONTAIN', color: '#ef5b5b' },
    { id: 'erad', name: 'Eradication', short: 'ERAD', color: '#a879ff' },
    { id: 'recover', name: 'Recovery', short: 'RECOVER', color: '#3ecf8e' },
    { id: 'lessons', name: 'Lessons Learned', short: 'LESSONS', color: '#2bc4c4' },
  ];

  const plays = [];
  function P(id, phase, title, summary, steps, o) {
    o = o || {};
    plays.push({
      id, phase, title, summary, steps,
      tools: o.tools || [], artifacts: o.artifacts || [], roles: o.roles || [],
      tags: o.tags || [], attack: o.attack || [], time: o.time || '',
      refs: o.refs || [],
    });
  }

  /* ---------------- Preparation ---------------- */
  P('PRE-001', 'prep', 'Confirm IR roles and call tree',
    'Make sure everyone knows who leads, who decides, and how to reach them, including after hours.',
    ['Identify the incident commander and a deputy', 'Confirm technical leads for endpoint, identity, network and cloud',
     'Verify the executive, legal, HR and communications contacts', 'Test the call tree and update stale numbers'],
    { roles: ['IR Lead'], tags: ['governance', 'contacts'], time: '1h' });
  P('PRE-002', 'prep', 'Establish out-of-band communications',
    'Assume corporate email and chat may be watched by the attacker. Stand up a separate channel.',
    ['Pick a channel outside the corporate identity provider (e.g. Signal group or separate tenant)',
     'Share a bridge line or meeting link that does not rely on compromised accounts',
     'Agree a codename for the incident', 'Tell responders not to discuss the incident on corporate channels'],
    { roles: ['IR Lead'], tags: ['comms', 'opsec'], time: '30m' });
  P('PRE-003', 'prep', 'Verify logging coverage and retention',
    'Confirm the telemetry you will need exists and is retained long enough to investigate.',
    ['Check EDR deployment coverage against the asset inventory', 'Confirm Windows Security, PowerShell and Sysmon logs forward to the SIEM',
     'Confirm identity provider, email and cloud audit logs are enabled', 'Extend retention on relevant sources before they roll over'],
    { tools: ['SIEM', 'EDR console'], roles: ['Detection Engineering'], tags: ['logging', 'telemetry'], time: '2h' });
  P('PRE-004', 'prep', 'Validate offline and immutable backups',
    'Know that clean, restorable backups exist before you need them.',
    ['Confirm at least one copy is offline or immutable', 'Check backup console credentials are not domain-joined or shared',
     'Test-restore a representative system', 'Record backup schedules and the latest known-good restore points'],
    { roles: ['Infrastructure'], tags: ['backups', 'ransomware'], time: '2h' });
  P('PRE-005', 'prep', 'Stage forensic jump kit',
    'Have collection tools, storage and write blockers ready before an incident.',
    ['Stage triage collectors (KAPE, Velociraptor) and memory capture tools', 'Prepare encrypted, wiped external storage',
     'Confirm hardware write blockers work', 'Keep chain-of-custody forms and hashing utilities with the kit'],
    { tools: ['KAPE', 'Velociraptor', 'FTK Imager', 'WinPmem', 'Magnet RAM Capture'], roles: ['Forensics'], tags: ['forensics', 'toolkit'], time: '2h' });
  P('PRE-006', 'prep', 'Maintain crown-jewel asset inventory',
    'Know which systems and data matter most so you can prioritize scoping and recovery.',
    ['List critical business systems and their owners', 'Map where sensitive and regulated data lives',
     'Document dependencies (identity, DNS, backups)', 'Agree recovery priority order with the business'],
    { roles: ['IR Lead', 'Business Owners'], tags: ['assets', 'scoping'], time: '4h' });
  P('PRE-007', 'prep', 'Activate IR retainer',
    'Engage an outside incident response firm early when the incident exceeds internal capacity.',
    ['Contact the retainer firm through the agreed process', 'Route the engagement through counsel where privilege matters',
     'Share scope, timeline and access requirements', 'Agree reporting cadence and deliverables'],
    { roles: ['IR Lead', 'Legal'], tags: ['third-party', 'retainer'], time: '1h' });

  /* ---------------- Identification ---------------- */
  P('IDN-001', 'ident', 'Triage the initial alert',
    'Decide whether the alert is a true positive and how serious it looks.',
    ['Review the alert details, the affected host and user', 'Pull surrounding telemetry for 24 hours either side',
     'Check whether indicators match known threat intelligence', 'Record your finding: false positive, benign true positive, or incident'],
    { tools: ['SIEM', 'EDR console'], roles: ['SOC Analyst'], tags: ['triage', 'alert'], time: '30m' });
  P('IDN-002', 'ident', 'Declare incident and assign severity',
    'Formally declare the incident so the right people, budget and authority come into play.',
    ['Apply your severity matrix (impact × scope × data sensitivity)', 'Name the incident commander',
     'Kick off the out-of-band bridge', 'Set the first update time for leadership'],
    { roles: ['IR Lead'], tags: ['governance', 'severity'], time: '15m' });
  P('IDN-003', 'ident', 'Open case record and evidence log',
    'Start the running record of decisions, actions and evidence from the first minute.',
    ['Create the case ticket with a unique incident ID', 'Start a timestamped action log (UTC)',
     'Start a chain-of-custody log for every evidence item', 'Store hashes for all collected evidence'],
    { roles: ['IR Lead', 'Forensics'], tags: ['documentation', 'chain-of-custody'], time: '15m' });
  P('IDN-004', 'ident', 'Engage legal counsel',
    'Bring in counsel early to protect privilege and guide notification decisions.',
    ['Notify in-house or outside counsel', 'Decide whether the investigation runs under privilege',
     'Agree how findings are written and shared', 'Flag any contractual notification clauses'],
    { roles: ['Legal', 'IR Lead'], tags: ['legal', 'privilege'], time: '30m' });
  P('IDN-005', 'ident', 'Notify cyber insurance carrier',
    'Many policies require prompt notice and approval of vendors before costs are covered.',
    ['Locate the policy and the claims hotline', 'Report the incident within the policy notice window',
     'Confirm which IR, legal and negotiation vendors are pre-approved', 'Track all incident costs from the start'],
    { roles: ['Legal', 'Finance'], tags: ['insurance'], time: '30m' });
  P('IDN-006', 'ident', 'Assess notification obligations',
    'Work out which regulators, customers and partners may need to be told, and by when.',
    ['Identify the data types and jurisdictions involved', 'List regulatory clocks (e.g. GDPR 72 hours after awareness; SEC 8-K Item 1.05 within four business days of a materiality determination)',
     'Review customer and partner contract obligations', 'Document the decision and its reasoning with counsel'],
    { roles: ['Legal', 'Privacy', 'Compliance'], tags: ['notification', 'regulatory'], time: '2h' });
  P('IDN-007', 'ident', 'Capture volatile memory',
    'Collect RAM before rebooting or isolating so in-memory malware, keys and connections are preserved.',
    ['Run a memory capture tool from external media', 'Hash the image and log it in chain of custody',
     'Collect running processes and network connections as a quick fallback', 'Analyze with Volatility for injected code, network artifacts and credentials'],
    { tools: ['WinPmem', 'Magnet RAM Capture', 'AVML', 'Volatility 3'], artifacts: ['Memory image'], roles: ['Forensics'], tags: ['forensics', 'memory', 'volatile'], time: '1h' });
  P('IDN-008', 'ident', 'Run triage collection',
    'Pull high-value artifacts quickly from affected endpoints without a full image.',
    ['Run a triage target set across the affected hosts', 'Include event logs, registry hives, $MFT, $UsnJrnl, Prefetch, Amcache, SRUM, browser and LNK files',
     'Hash and store collections centrally', 'Parse with standard tooling for timeline analysis'],
    { tools: ['KAPE', 'Velociraptor', 'CyLR', 'EZ Tools'], artifacts: ['$MFT', 'Event logs', 'Registry hives', 'Prefetch', 'Amcache', 'SRUM'], roles: ['Forensics'], tags: ['forensics', 'triage', 'collection'], time: '1h' });
  P('IDN-009', 'ident', 'Acquire full disk image',
    'Create a forensically sound copy when deep analysis or legal action is likely.',
    ['Decide physical vs. logical image based on encryption and urgency', 'Use a write blocker for physical media; snapshot for VMs and cloud disks',
     'Verify image hashes match the source', 'Record acquisition in chain of custody'],
    { tools: ['FTK Imager', 'dc3dd', 'Cloud snapshots'], artifacts: ['Disk image (E01/raw)'], roles: ['Forensics'], tags: ['forensics', 'imaging', 'legal'], time: '4h' });
  P('IDN-010', 'ident', 'Hunt for lateral movement',
    'Find where the attacker moved and which credentials they used to get there.',
    ['Review logons 4624 (types 3 and 10), 4648, 4672 and 4776', 'Look for new services (7045) and scheduled tasks (4698)',
     'Check RDP, SMB, WinRM, WMI and PsExec activity between hosts', 'Map source → destination host pairs into a graph'],
    { tools: ['SIEM', 'Hayabusa', 'Chainsaw', 'Spoke'], artifacts: ['Security.evtx', 'System.evtx', 'RDP logs'], roles: ['Forensics', 'Threat Hunter'], tags: ['lateral-movement', 'windows', 'event-logs'], attack: ['T1021', 'T1550', 'T1569.002'], time: '3h' });
  P('IDN-011', 'ident', 'Build incident timeline',
    'Merge evidence into one timeline so the story of the intrusion is clear.',
    ['Generate a super timeline from triage and disk artifacts', 'Pivot on known-bad times, users, files and hosts',
     'Mark key events: initial access, execution, persistence, movement, impact', 'Keep the timeline in UTC and cite the source of every row'],
    { tools: ['Plaso', 'Timesketch', 'Timeline Explorer'], roles: ['Forensics'], tags: ['timeline', 'analysis'], time: '4h' });
  P('IDN-012', 'ident', 'Review persistence mechanisms',
    'Find every way the attacker could come back after a reboot or password reset.',
    ['Check Run/RunOnce keys, services, scheduled tasks and startup folders', 'Check WMI event subscriptions and COM hijacks',
     'Review new or modified local and domain accounts', 'Compare autoruns against a known-good baseline'],
    { tools: ['Autoruns', 'Velociraptor', 'EDR console'], roles: ['Forensics'], tags: ['persistence', 'windows'], attack: ['T1547', 'T1053', 'T1543', 'T1546.003', 'T1136'], time: '2h' });
  P('IDN-013', 'ident', 'Review identity provider sign-ins',
    'Look for account takeover in cloud identity logs.',
    ['Pull sign-in logs for the affected users (Entra ID / Okta / Google)', 'Look for impossible travel, new devices, anonymizing IPs and legacy protocols',
     'Check for MFA fatigue patterns and newly registered MFA methods', 'Identify every IP and session tied to the attacker'],
    { tools: ['Entra ID sign-in logs', 'Okta System Log', 'SIEM'], roles: ['Identity', 'SOC Analyst'], tags: ['identity', 'cloud', 'account-takeover'], attack: ['T1078', 'T1621', 'T1098.005'], time: '2h' });
  P('IDN-014', 'ident', 'Investigate mailbox activity',
    'Work out what an attacker did inside a compromised mailbox.',
    ['Search the unified audit log for the affected mailbox', 'List inbox rules, forwarding settings and delegates',
     'Review MailItemsAccessed / Send events to see what was read and sent', 'Check for OAuth applications granted by the user'],
    { tools: ['Microsoft Purview audit', 'Google Workspace audit', 'Hawk'], roles: ['Messaging', 'SOC Analyst'], tags: ['email', 'bec', 'cloud'], attack: ['T1114', 'T1564.008', 'T1534'], time: '2h' });
  P('IDN-015', 'ident', 'Analyze suspicious file',
    'Understand what a malicious file does and pull out indicators.',
    ['Hash the sample and check reputation services', 'Run static triage: strings, imports, signatures, packing',
     'Detonate in an isolated sandbox', 'Extract IOCs: domains, IPs, mutexes, dropped files, registry changes'],
    { tools: ['VirusTotal', 'CAPA', 'FLOSS', 'Sandbox', 'CyberChef'], roles: ['Malware Analyst'], tags: ['malware', 'analysis', 'ioc'], time: '3h' });
  P('IDN-016', 'ident', 'Review network telemetry',
    'Use network logs to find command-and-control traffic and data leaving the environment.',
    ['Search firewall, proxy and DNS logs for known indicators', 'Look for beaconing (regular intervals, consistent sizes)',
     'Look for large outbound transfers and unusual destinations', 'Identify every internal host talking to attacker infrastructure'],
    { tools: ['Firewall logs', 'Proxy logs', 'Zeek', 'RITA', 'NetFlow'], roles: ['Network', 'Threat Hunter'], tags: ['network', 'c2', 'exfiltration'], attack: ['T1071', 'T1041', 'T1048'], time: '3h' });
  P('IDN-017', 'ident', 'Determine data exfiltration scope',
    'Figure out what data may have been taken, which drives notification and extortion response.',
    ['Look for staging (archives, rclone, MEGA, cloud storage tools)', 'Correlate outbound volumes with the timeline',
     'Identify file shares and databases the attacker accessed', 'Document what was confirmed vs. what is possible'],
    { tools: ['Proxy logs', 'EDR console', 'File server audit logs'], roles: ['Forensics', 'Legal'], tags: ['exfiltration', 'data', 'notification'], attack: ['T1567', 'T1560', 'T1074'], time: '4h' });
  P('IDN-018', 'ident', 'Identify initial access vector',
    'Find how the attacker got in so the door can be closed.',
    ['Work backwards on the timeline to the earliest malicious event', 'Check phishing, exposed services, VPN and stolen credentials',
     'Review vulnerability scans for exploitable internet-facing systems', 'Confirm the vector with at least two independent evidence sources'],
    { roles: ['Forensics', 'IR Lead'], tags: ['initial-access', 'root-cause'], attack: ['T1566', 'T1190', 'T1133', 'T1078'], time: '4h' });
  P('IDN-019', 'ident', 'Review cloud control-plane logs',
    'Look for attacker actions against your cloud accounts and resources.',
    ['Pull CloudTrail, Azure Activity / Entra audit, or GCP audit logs', 'Look for new IAM users, keys, roles and policy changes',
     'Look for unusual regions, instance launches and storage access', 'Identify all access keys and principals the attacker used'],
    { tools: ['AWS CloudTrail', 'Azure Activity Log', 'GCP Cloud Audit Logs'], roles: ['Cloud'], tags: ['cloud', 'iam'], attack: ['T1078.004', 'T1098', 'T1530'], time: '3h' });
  P('IDN-020', 'ident', 'Hunt for credential dumping',
    'Check whether the attacker harvested passwords or hashes, which widens the reset scope.',
    ['Look for LSASS access and dumps (procdump, comsvcs.dll MiniDump)', 'Look for NTDS.dit extraction or DCSync (4662 with replication GUIDs)',
     'Check for Kerberoasting (4769 with RC4)', 'List every account whose credentials may be exposed'],
    { tools: ['EDR console', 'SIEM'], roles: ['Threat Hunter', 'Identity'], tags: ['credentials', 'active-directory'], attack: ['T1003', 'T1003.006', 'T1558.003'], time: '2h' });
  P('IDN-021', 'ident', 'Extract and share IOCs',
    'Package indicators so blocking, hunting and partners can use them.',
    ['Collect hashes, domains, IPs, file paths, user agents and account names', 'Remove false positives and internal infrastructure',
     'Load indicators into the TIP/MISP with context and confidence', 'Push to blocking and hunting teams'],
    { tools: ['MISP', 'OpenCTI', 'STIX'], roles: ['CTI'], tags: ['ioc', 'threat-intel'], time: '1h' });
  P('IDN-022', 'ident', 'Identify ransomware variant',
    'Knowing the family tells you its usual behavior, leak site and whether a decryptor exists.',
    ['Collect the ransom note and an encrypted sample file', 'Identify the family (ID Ransomware, vendor reports)',
     'Check No More Ransom for a free decryptor', 'Check the group\'s leak site for victim posting'],
    { tools: ['ID Ransomware', 'No More Ransom'], roles: ['CTI', 'Malware Analyst'], tags: ['ransomware', 'threat-intel'], attack: ['T1486'], time: '1h' });
  P('IDN-023', 'ident', 'Review web server logs and hunt web shells',
    'Find exploitation of a public-facing application and any web shells left behind.',
    ['Search access logs for exploit patterns and unusual POSTs to static paths', 'List recently created or modified files in web roots',
     'Look for web server processes spawning shells', 'Compare deployed code to source control'],
    { tools: ['Web server logs', 'EDR console', 'YARA'], roles: ['Forensics', 'App Owner'], tags: ['web', 'web-shell'], attack: ['T1190', 'T1505.003'], time: '3h' });
  P('IDN-024', 'ident', 'Review user activity for insider risk',
    'Investigate possible malicious or negligent insider activity carefully and with HR and legal.',
    ['Confirm authorization with HR and legal before searching', 'Review DLP, file access and USB/cloud upload activity',
     'Correlate with access badges and HR events (resignation, PIP)', 'Keep the investigation need-to-know'],
    { tools: ['DLP console', 'UEBA', 'Spoke'], roles: ['Insider Risk', 'HR', 'Legal'], tags: ['insider-risk', 'dlp'], time: '4h' });

  /* ---------------- Containment ---------------- */
  P('CON-001', 'contain', 'Preserve evidence before containment',
    'Some containment steps destroy evidence. Capture it first when time allows.',
    ['Snapshot affected VMs and cloud disks', 'Capture memory on key hosts', 'Export logs that may roll over',
     'Record exactly what will be changed and when'],
    { tools: ['Cloud snapshots', 'WinPmem'], roles: ['Forensics'], tags: ['forensics', 'evidence'], time: '1h' });
  P('CON-002', 'contain', 'Isolate host with EDR',
    'Cut a compromised endpoint off from the network while keeping EDR access for investigation.',
    ['Confirm the host and its business owner', 'Trigger EDR network containment', 'Verify isolation (no outbound except the EDR cloud)',
     'Record the isolation time in the case log'],
    { tools: ['EDR console'], roles: ['SOC Analyst'], tags: ['endpoint', 'isolation'], time: '15m' });
  P('CON-003', 'contain', 'Disable compromised accounts',
    'Stop the attacker from using known-compromised user and service accounts.',
    ['Disable the accounts in AD and the cloud identity provider', 'Coordinate with service owners before disabling service accounts',
     'Notify the affected users through a verified channel', 'Record every account action'],
    { roles: ['Identity'], tags: ['identity', 'accounts'], attack: ['T1078'], time: '30m' });
  P('CON-004', 'contain', 'Reset credentials and revoke sessions',
    'A password reset alone leaves stolen tokens working. Revoke sessions too.',
    ['Reset passwords for the affected accounts', 'Revoke refresh tokens and active sessions (e.g. Revoke-MgUserSignInSession, Okta clear sessions)',
     'Remove attacker-registered MFA methods and devices', 'Monitor for re-authentication from attacker IPs'],
    { tools: ['Entra ID', 'Okta', 'Google Admin'], roles: ['Identity'], tags: ['identity', 'tokens', 'cloud'], attack: ['T1550.001', 'T1539'], time: '30m' });
  P('CON-005', 'contain', 'Block IOCs at controls',
    'Push confirmed indicators to every control that can block them.',
    ['Block domains and IPs at the firewall, proxy and DNS', 'Add file hashes to EDR block lists',
     'Block sender domains and URLs at the email gateway', 'Set alerts for any further hits'],
    { tools: ['Firewall', 'Proxy', 'DNS sinkhole', 'EDR console', 'Email gateway'], roles: ['Network', 'SOC Analyst'], tags: ['ioc', 'blocking'], time: '1h' });
  P('CON-006', 'contain', 'Remove malicious mail rules and purge phishing',
    'Clean the attacker\'s mailbox changes and pull the phishing email from every inbox.',
    ['Delete malicious inbox rules, forwarding and delegates', 'Search all mailboxes for the phishing message',
     'Purge matching messages tenant-wide', 'Identify users who clicked or replied'],
    { tools: ['Microsoft Defender for Office 365', 'Purview content search', 'Google Workspace'], roles: ['Messaging'], tags: ['email', 'phishing', 'bec'], attack: ['T1564.008', 'T1566'], time: '1h' });
  P('CON-007', 'contain', 'Revoke malicious OAuth consent',
    'Remove third-party apps the attacker used to keep access without a password.',
    ['List enterprise applications and user consents for the affected users', 'Revoke grants for suspicious apps',
     'Disable the service principal tenant-wide', 'Restrict user consent to verified publishers'],
    { tools: ['Entra ID', 'Google Admin'], roles: ['Identity'], tags: ['oauth', 'cloud', 'persistence'], attack: ['T1550.001', 'T1528'], time: '30m' });
  P('CON-008', 'contain', 'Restrict lateral movement paths',
    'Limit the attacker\'s ability to spread between systems.',
    ['Block SMB, RDP and WinRM between workstations', 'Restrict admin access to jump hosts only',
     'Segment critical servers with temporary firewall rules', 'Monitor denied connections for attacker activity'],
    { tools: ['Firewall', 'GPO', 'EDR console'], roles: ['Network', 'Infrastructure'], tags: ['segmentation', 'lateral-movement'], attack: ['T1021'], time: '2h' });
  P('CON-009', 'contain', 'Rotate privileged and service account credentials',
    'Assume privileged credentials are exposed once the attacker has admin rights.',
    ['Rotate domain admin, enterprise admin and tier-0 credentials', 'Rotate service account passwords with owners',
     'Rotate local admin passwords (LAPS)', 'Rotate secrets in vaults and CI/CD'],
    { tools: ['LAPS', 'Secrets vault'], roles: ['Identity', 'Infrastructure'], tags: ['credentials', 'active-directory'], time: '4h' });
  P('CON-010', 'contain', 'Reset KRBTGT twice',
    'Invalidate forged Kerberos tickets (golden tickets) after domain compromise.',
    ['Confirm AD replication is healthy', 'Reset the KRBTGT password once', 'Wait until the reset has replicated to every DC and at least the maximum ticket lifetime has passed (10 hours by default)',
     'Reset it a second time and monitor for authentication errors'],
    { tools: ['Microsoft KRBTGT reset script'], roles: ['Identity'], tags: ['active-directory', 'kerberos'], attack: ['T1558.001'], time: '12h' });
  P('CON-011', 'contain', 'Protect backups from the attacker',
    'Attackers target backups to force payment. Lock them down immediately.',
    ['Disconnect or lock the backup infrastructure', 'Rotate backup console credentials', 'Enable immutability where possible',
     'Verify the latest clean restore points still exist'],
    { roles: ['Infrastructure'], tags: ['backups', 'ransomware'], attack: ['T1490'], time: '1h' });
  P('CON-012', 'contain', 'Cut internet egress',
    'A last-resort step to stop exfiltration or encryption spreading through C2.',
    ['Get executive approval with business impact noted', 'Block outbound at the perimeter except approved IR tooling',
     'Keep EDR and logging channels open', 'Plan staged restoration of egress'],
    { tools: ['Firewall'], roles: ['IR Lead', 'Network'], tags: ['network', 'egress', 'ransomware'], time: '30m' });
  P('CON-013', 'contain', 'Disable unauthorized remote access paths',
    'Close the remote access the attacker used or could use.',
    ['Block attacker IPs on VPN and disable affected VPN accounts', 'Remove internet exposure of RDP and other admin services',
     'Block unapproved RMM tools (AnyDesk, ScreenConnect, etc.)', 'Require MFA on all remaining remote access'],
    { tools: ['VPN', 'Firewall', 'EDR console'], roles: ['Network'], tags: ['remote-access', 'vpn'], attack: ['T1133', 'T1219'], time: '1h' });
  P('CON-014', 'contain', 'Rotate cloud access keys and secrets',
    'Deactivate keys the attacker used and rotate anything they could have read.',
    ['Deactivate compromised access keys and service principal secrets', 'Rotate secrets in parameter stores and key vaults',
     'Remove attacker-created IAM users, roles and policies', 'Apply SCPs or conditional access to block attacker regions or IPs'],
    { tools: ['AWS IAM', 'Azure Key Vault', 'GCP IAM'], roles: ['Cloud'], tags: ['cloud', 'iam', 'secrets'], time: '2h' });
  P('CON-015', 'contain', 'Take vulnerable application offline or virtual-patch',
    'Stop ongoing exploitation of a public-facing application.',
    ['Apply a WAF rule or take the service offline', 'Put up a maintenance page and notify stakeholders',
     'Preserve logs and a disk snapshot first', 'Track the exposure window for scoping'],
    { tools: ['WAF', 'Load balancer'], roles: ['App Owner', 'Network'], tags: ['web', 'vulnerability'], attack: ['T1190'], time: '1h' });

  /* ---------------- Eradication ---------------- */
  P('ERA-001', 'erad', 'Remove malware and persistence',
    'Remove every malicious file and persistence mechanism found during analysis.',
    ['Delete malicious binaries, scripts and web shells', 'Remove malicious services, tasks, run keys and WMI subscriptions',
     'Remove attacker-created accounts', 'Document every removal with path and hash'],
    { tools: ['EDR console', 'Velociraptor'], roles: ['Forensics', 'Infrastructure'], tags: ['malware', 'persistence'], time: '2h' });
  P('ERA-002', 'erad', 'Reimage compromised hosts',
    'When in doubt, rebuild. Reimaging is more reliable than cleaning.',
    ['Confirm evidence collection is complete', 'Wipe and reimage from a known-good gold image',
     'Patch fully before reconnecting', 'Restore user data from clean sources only'],
    { roles: ['Infrastructure', 'Desktop Support'], tags: ['rebuild', 'endpoint'], time: '4h' });
  P('ERA-003', 'erad', 'Patch the exploited vulnerability',
    'Close the vulnerability that allowed initial access or escalation.',
    ['Confirm the CVE and affected versions', 'Apply the vendor patch or mitigation',
     'Scan to confirm the fix', 'Check for other systems with the same exposure'],
    { tools: ['Vulnerability scanner'], roles: ['Infrastructure', 'App Owner'], tags: ['vulnerability', 'patching'], time: '4h' });
  P('ERA-004', 'erad', 'Remove unauthorized access',
    'Clean up any access the attacker granted themselves.',
    ['Audit privileged groups for unexpected members', 'Remove rogue accounts, keys, certificates and app registrations',
     'Review GPO and conditional access changes during the intrusion window', 'Review delegated and federated trust changes'],
    { roles: ['Identity', 'Cloud'], tags: ['identity', 'access'], attack: ['T1098', 'T1136', 'T1484'], time: '2h' });
  P('ERA-005', 'erad', 'Remove unauthorized remote access tools',
    'Uninstall the RMM and tunneling tools attackers commonly leave behind.',
    ['Inventory remote access software across the fleet', 'Uninstall anything not on the approved list',
     'Remove tunnels (ngrok, Cloudflared, Chisel) and proxies', 'Add application control rules to prevent reinstall'],
    { tools: ['EDR console', 'Software inventory'], roles: ['Infrastructure'], tags: ['remote-access', 'rmm'], attack: ['T1219', 'T1572'], time: '2h' });
  P('ERA-006', 'erad', 'Validate eradication with a fleet sweep',
    'Prove the attacker is gone before you start recovery.',
    ['Re-sweep all hosts for every known IOC and TTP', 'Run YARA and hunting queries across the fleet',
     'Confirm no new C2 traffic for an agreed quiet period', 'Get IR lead sign-off to move to recovery'],
    { tools: ['EDR console', 'Velociraptor', 'YARA', 'SIEM'], roles: ['Threat Hunter', 'IR Lead'], tags: ['validation', 'hunting'], time: '4h' });
  P('ERA-007', 'erad', 'Harden exploited configurations',
    'Fix the weak settings the attacker relied on.',
    ['Disable legacy authentication protocols', 'Remove excessive admin rights and local admin from users',
     'Enable credential protections (LSA protection, Credential Guard)', 'Apply attack surface reduction rules'],
    { tools: ['GPO', 'Intune', 'Conditional Access'], roles: ['Infrastructure', 'Identity'], tags: ['hardening'], time: '1d' });
  P('ERA-008', 'erad', 'Enforce phishing-resistant MFA',
    'Upgrade MFA for affected and privileged users so stolen passwords and push fatigue stop working.',
    ['Require MFA for all affected users', 'Move privileged users to FIDO2 or certificate-based MFA',

(function () {

    'Make sure responders can get read-only and forensic access fast, without asking the team whose account may be compromised.',
    ['Create a read-only security audit role in every AWS account, Azure subscription and GCP project',
     'Create a separate forensic role that can snapshot disks and share them to the forensics account',
     'Protect both roles with phishing-resistant MFA and alert on every use',

/* Small helpers shared across Huddle. */
(function () {
  const H = window.H;
  const U = (H.U = {});

  /** Create an element: el('div.cls#id', {attrs}, children...) */
  U.el = function (sel, attrs, ...kids) {
    const m = sel.match(/^([a-z0-9-]+)?((?:[.#][\w-]+)*)$/i);
    const node = document.createElement((m && m[1]) || 'div');
    if (m && m[2]) {
      m[2].replace(/([.#])([\w-]+)/g, (_, t, v) => {
        if (t === '.') node.classList.add(v); else node.id = v;
      });
    }
    if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (k === 'html') node.innerHTML = v;
      else if (k === 'text') node.textContent = v;
      else if (k in node && typeof v !== 'string') node[k] = v;
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat(Infinity)) {
      if (k == null || k === false) continue;
      node.append(k instanceof Node ? k : document.createTextNode(String(k)));
    }
    return node;
  };

  U.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.uid = (p = 'n') => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
  U.clone = (o) => JSON.parse(JSON.stringify(o));
  U.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  U.slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
  U.lines = (s) => String(s || '').split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
  U.list = (v) => {
    if (Array.isArray(v)) return v.map((x) => String(x).trim()).filter(Boolean);
    if (v == null || v === '') return [];
    return String(v).split(/\s*[|;\n]\s*/).map((x) => x.trim()).filter(Boolean);
  };
  U.nowIso = () => new Date().toISOString();
  U.fmtTs = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toISOString().replace('T', ' ').slice(0, 16) + 'Z';
  };

  U.attackUrl = (id) => {
    if (H.ATTACK) return H.ATTACK.url(id);
    const m = String(id).toUpperCase().match(/^(T\d{4})(?:\.(\d{3}))?$/);
    if (!m) return null;
    return 'https://attack.mitre.org/techniques/' + m[1] + '/' + (m[2] ? m[2] + '/' : '');
  };

  U.store = {
    get(k, fallback) {
      try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
