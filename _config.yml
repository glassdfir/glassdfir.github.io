# Site wide configuration

title: Half Full of Security
locale: en_US
description: Sharpening the ACKs since 2013
logo: /images/site-logo.svg
search: true
url: https://jon.glass

# Jekyll configuration

permalink:   /:categories/:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag

# jekyll-seo-tag
author: Jon Glass
twitter:
  username: GlassDFIR
social:
  name: Jon Glass
  links:
    - https://github.com/glassdfir
    - https://x.com/GlassDFIR

# Keep redirect stubs and stray files out of the sitemap
defaults:
  - scope:
      path: ""
      type: posts
    values:
      image: /images/site-logo.png
  - scope:
      path: "sundial"
    values:
      sitemap: false
  - scope:
      path: "images"
    values:
      sitemap: false

kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..2
  enable_coderay: false

mathjax: true

include: [".htaccess"]
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", ".less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md", "vendor"]


# Site owner
owner:
  name: Jon Glass
  avatar: bio-photo.jpg
  email: email@jon.glass
  disqus-shortname:
  twitter: GlassDFIR
  github: GlassDFIR
  #stackexchange: #http://stackoverflow.com/users/123456/username
  #linkedin: #username
  #instagram: #username
  #flickr: #username
  #tumblr: #username
  #pinterest: #username
  #weibo: #userid
  google:
    analytics:
    verify:
    ad-client:
    ad-slot:
  bing-verify:
