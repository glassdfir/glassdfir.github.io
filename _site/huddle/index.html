  };
  function startTemplate(t) {
    try { H.replacePlaybook(H.templateToPlaybook(t)); U.toast('Loaded template: ' + t.name); } catch (e) { U.toast('Template failed: ' + e.message, true); }
  }

  /* ---------------- Files ---------------- */
  H.pickFile = () => $('file-input').click();
  H.importFile = async function (file) {
    try {
      const text = await file.text();
      const t = text.trim();
      if (t.startsWith('{')) {
        const obj = JSON.parse(t);
        if (Array.isArray(obj.nodes)) {
          const prev = S.pb && S.pb.nodes.length ? JSON.stringify(S.pb) : null;
          H.loadPlaybook(obj);
          if (prev) S.past.push(prev);
          H.changed(); requestAnimationFrame(H.fitView);
          U.toast('Opened playbook: ' + (obj.name || file.name));
          return;
        }
      }
      const name = file.name.replace(/\.(json|csv)$/i, '');
      const lib = H.parseLibraryText(text, name);
      H.addFileLib(name, lib);
      S.filter.lib = 'file:' + name;
      H.changed();
      U.toast('Imported ' + lib.plays.length + ' plays from ' + file.name);
    } catch (e) {
      U.toast('Could not import ' + file.name + ': ' + e.message, true);
    }
  };

  /* ---------------- Menus ---------------- */
  function buildNewMenu() {
    const list = $('menu-new');
    const items = [el('button', { onclick: () => H.replacePlaybook(H.newPlaybook()) }, 'Blank playbook', el('span.desc', 'Start from an empty canvas')),
      el('div.menu-label', 'Templates')];
    H.allTemplates().forEach((t) => items.push(el('button', { onclick: () => startTemplate(t) }, t.name, el('span.desc', t.description || t._lib))));
    list.replaceChildren(...items);
    $('empty-templates').replaceChildren(...H.allTemplates().map((t) => el('button.btn', { onclick: () => startTemplate(t), title: t.description }, t.name)));
  }
  H.buildNewMenu = buildNewMenu;

  function initMenus() {
    document.querySelectorAll('.menu > .btn').forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const m = b.parentElement, open = m.classList.contains('open');
      document.querySelectorAll('.menu.open').forEach((x) => x.classList.remove('open'));
      if (!open) { if (m.dataset.menu === 'new') buildNewMenu(); m.classList.add('open'); }
    }));
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-list') || e.target.closest('button')) document.querySelectorAll('.menu.open').forEach((x) => x.classList.remove('open'));
    });
    document.querySelectorAll('[data-export]').forEach((b) => b.addEventListener('click', () => H.doExport(b.dataset.export)));

    $('btn-open').onclick = H.pickFile;
    $('file-input').addEventListener('change', (e) => { [...e.target.files].forEach((f) => H.importFile(f)); e.target.value = ''; });
    $('btn-share').onclick = async () => {
      const url = await H.shareUrl();
      const ok = await U.copy(url);
      const kb = (url.length / 1024).toFixed(1);
      if (!ok) { U.modal({ title: 'Share link', body: el('pre', url) }); return; }
      U.toast(url.length > 8000 ? 'Link copied (' + kb + ' KB). Long links can break in some chat tools; Export JSON and use ?pb=<url> instead.' : 'Share link copied (' + kb + ' KB)', url.length > 8000);
    };
    $('btn-undo').onclick = H.undo;
    $('btn-redo').onclick = H.redo;
    $('btn-layout').onclick = () => { H.commit(); H.layout(); H.changed(); H.fitView(); };
    $('btn-run').onclick = H.openRun;
    $('btn-theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
    $('btn-help').onclick = showHelp;

    const name = $('pb-name');
    let committed = false;
    name.addEventListener('focus', () => (committed = false));
    name.addEventListener('input', () => { if (!committed) { H.commit(); committed = true; } S.pb.name = name.value; H.changed({ library: false }); });
    name.addEventListener('keydown', (e) => { if (e.key === 'Enter') name.blur(); });
  }

  function setTheme(t, persist) {
    document.documentElement.dataset.theme = t;
    if (persist) U.store.set('huddle.theme', t);
  }

  /* ---------------- Keyboard ---------------- */
  function initKeys() {
    document.addEventListener('keydown', (e) => {
      const typing = e.target.closest('input, textarea, select, [contenteditable]');
      const runOpen = !$('run').hidden;
      const mod = e.ctrlKey || e.metaKey;
      if (e.key === 'Escape') {
        if (runOpen) { H.closeRun(); return; }
        if (typing) { e.target.blur(); return; }
        if (S.sel) { S.sel = null; H.changed({ library: true }); }
        return;
      }
      if (typing || runOpen || document.querySelector('.modal-back')) return;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? H.redo() : H.undo(); }
      else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); H.redo(); }
      else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); H.duplicateSelection(); }
      else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); H.savePlaybook(); }
      else if (e.key === 'Delete' || e.key === 'Backspace') { if (S.sel) { e.preventDefault(); H.deleteSelection(); } }
      else if (e.key === '/') { e.preventDefault(); $('search').focus(); $('search').select(); }
      else if (!mod && e.key.toLowerCase() === 'f') H.fitView();
      else if (!mod && (e.key === '+' || e.key === '=')) H.zoomAt(1.2);
      else if (!mod && e.key === '-') H.zoomAt(1 / 1.2);
    });
  }

  /* ---------------- Help ---------------- */
  function showHelp() {
    const row = (a, b) => el('tr', el('td', el('code', a)), el('td', b));
    U.modal({
      title: 'Huddle help', wide: true,
      body: el('div',
        el('p', 'Huddle builds incident response playbooks from a library of DFIR plays arranged across the incident lifecycle. Everything runs in your browser; nothing is uploaded.'),
        el('h4', 'URL options'),
        el('p.muted', 'Like CyberChef, the full playbook lives in the address bar after ', el('code', '#pb='), ', so any link reproduces it exactly. Query options extend or configure the app:'),
        el('table', el('tr', el('th', 'Parameter'), el('th', 'What it does')),
          row('?lib=<url>', 'Load an extra play library (JSON or CSV). Repeat to load several. The host must allow CORS.'),
          row('?pb=<url>', 'Load a playbook JSON from a URL, e.g. a file in your team\'s repo.'),
          row('?template=<id>', 'Start from a template: ' + H.allTemplates().map((t) => t.id).join(', ') + '.'),
          row('?q=<text>', 'Pre-fill the library search.'),
          row('?phase=<id,id>', 'Pre-filter the library by phase: ' + S.phases.map((p) => p.id).join(', ') + '.'),
          row('?mode=run', 'Open straight into run mode, for responders working the playbook.'),
          row('?mode=view', 'Read-only diagram (run mode still works).'),
          row('?theme=light|dark', 'Force a theme.'),
          row('#pb=<data>', 'The compressed playbook itself (written automatically).')),
        el('h4', 'Library format'),
        el('p.muted', 'A library is JSON with a ', el('code', 'plays'), ' array, or a CSV with one play per row. Custom phases add new lanes. Libraries can also ship ', el('code', 'templates'), '.'),
        el('pre', JSON.stringify({
          name: 'Acme IR plays', version: '1.0.0',
          phases: [{ id: 'notify', name: 'Notification', color: '#e86fb0' }],
          plays: [{ id: 'ACME-001', title: 'Page the on-call IR lead', phase: 'Identification', summary: 'Use PagerDuty service IR-Primary.', steps: ['Trigger the IR-Primary service', 'Confirm acknowledgement within 15m'], tools: ['PagerDuty'], tags: ['comms'], attack: [], time: '15m', refs: ['https://wiki.acme.example/ir'] }],
        }, null, 2)),
        el('p.muted', 'CSV columns: ', el('code', 'id, title, phase, summary, steps, tools, artifacts, roles, tags, attack, time, refs'), '. Separate list items with ', el('code', '|'), '. Only ', el('code', 'title'), ' is required; ', el('code', 'phase'), ' accepts names like "Containment" or "Detection & Analysis".'),
        el('h4', 'Shortcuts'),
        el('table',
          row('/', 'Search plays'), row('Delete', 'Delete selection'), row('Ctrl+Z / Ctrl+Shift+Z', 'Undo / redo'),
          row('Ctrl+D', 'Duplicate node'), row('Ctrl+S', 'Save to My playbooks'), row('F', 'Fit diagram'),
          row('Scroll / Ctrl+scroll', 'Pan / zoom'), row('Alt while dragging', 'Free placement (no lane snap)'), row('Esc', 'Deselect / close')),
        el('h4', 'Arrow-key navigation'),
        el('table',
          row('↑ / ↓', 'Library: move through plays and phase groups. Canvas: move up or down within a lane'),
          row('← / →', 'Library: collapse / expand a group (→ on a play jumps to the canvas). Canvas: follow the flow back / forward'),
          row('Enter', 'Library: add the play to the playbook, or open/close a group. Canvas: edit the selected node'),
          row('[ / ]', 'Switch to the library / the canvas'),
          row('↓ in search', 'Jump from the search box into the results'))),
      buttons: [{ label: 'Close', primary: true }],
    });
  }

  /* ---------------- Boot ---------------- */
  async function boot() {
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme') || U.store.get('huddle.theme', null) || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme(theme === 'light' ? 'light' : 'dark');

    H.initLibraries();
    H.initCanvas();
    H.initPanels();
    initMenus();
    initKeys();
    H.initPlaybooks();
    H.initNav();
    S.pb = H.newPlaybook();

    const abs = (u) => { try { return new URL(u, location.href).href; } catch (e) { return u; } };
    const libUrls = [...new Set([...params.getAll('lib'), ...H.storedUrlLibs()].filter(Boolean).map(abs))];
    await Promise.all(libUrls.map((u) => H.loadLibUrl(u, { quiet: true })));
    if (libUrls.length) U.toast('Loaded ' + libUrls.length + ' extra librar' + (libUrls.length === 1 ? 'y' : 'ies'));

    let fromTemplate = false;
    const hash = new URLSearchParams(location.hash.slice(1));
    try {
      if (hash.get('pb')) H.loadPlaybook(await U.decodeState(hash.get('pb')));
      else if (params.get('pb')) {
        const res = await fetch(params.get('pb'));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        H.loadPlaybook(await res.json());
      } else if (params.get('template')) {
        const t = H.allTemplates().find((x) => x.id === params.get('template'));
        if (!t) throw new Error('Unknown template ' + params.get('template'));
        S.pb = H.templateToPlaybook(t); fromTemplate = true;
      } else if (H.storedPlaybook()) H.loadPlaybook(H.storedPlaybook());
    } catch (e) {
      U.toast('Could not load playbook: ' + e.message, true);
      const stored = H.storedPlaybook();
      if (stored) { try { H.loadPlaybook(stored); } catch (e2) { /* keep blank */ } }
    }

    if (params.get('q')) { S.filter.q = params.get('q'); $('search').value = S.filter.q; }
    if (params.get('phase')) params.get('phase').split(',').forEach((p) => S.filter.phases.add(H.resolvePhase(p)));
    if (params.get('mode') === 'view') { S.readOnly = true; document.body.classList.add('read-only'); }

    buildNewMenu();
    H.changed();
    requestAnimationFrame(() => {
      if (fromTemplate) { H.layout(S.pb, true); H.changed(); }
      if (S.pb.nodes.length) H.fitView();
      if (params.get('mode') === 'run') H.openRun();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
